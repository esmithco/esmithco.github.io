<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Notes</title>
  <link rel="stylesheet" href="site.css">
</head>
<body class="reader-page">
  <header class="reader-bar">
    <div class="reader-nav">
      <a class="reader-home" href="/" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>
      </a>
      <a class="back-link" href="chapters.html">← Chapters</a>
    </div>
    <p id="position" class="position" aria-live="polite"></p>
    <nav class="reader-controls" aria-label="Note navigation">
      <button id="previous" type="button" aria-label="Previous note">←</button>
      <button id="next" type="button" aria-label="Next note">→</button>
    </nav>
  </header>
  <main class="reader-shell">
    <iframe id="note" title="Book note"></iframe>
  </main>
  <script type="module" src="reader.js"></script>
</body>
</html>
