<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forecasting — Chapters</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230e8f82'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='5' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M50 32 C42 27 30 26 22 29 L22 71 C30 68 42 69 50 74 C58 69 70 68 78 71 L78 29 C70 26 58 27 50 32 Z'/%3E%3Cline x1='50' y1='32' x2='50' y2='74'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="site.css?v=3">
</head>

<body>
  <main class="library">
    <nav class="topnav" aria-label="Navigation">
      <a class="nav-btn nav-btn--icon" href="/" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>
      </a>
      <a class="nav-btn" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        Books
      </a>
    </nav>

    <p class="eyebrow">Forecasting: Principles and Practice</p>
    <h1>Chapters</h1>

    <section id="chapter-list" class="note-list" aria-label="Chapters">
      <p>Loading chapters...</p>
    </section>
  </main>

  <script>
    // Chapters come from a static manifest served by this site — fast, offline,
    // and not subject to the GitHub API rate limit (60 req/hr per IP).
    const chapterList = document.getElementById("chapter-list");

    async function loadChapters() {
      try {
        const manifest = await fetch("notes/fpp3/manifest.json")
          .then(r => { if (!r.ok) throw new Error("manifest"); return r.json(); });

        const chapters = manifest.chapters.slice().sort((a, b) =>
          a.name.localeCompare(b.name, undefined, { numeric: true }));

        chapterList.innerHTML = "";

        chapters.forEach((chapter, index) => {
          const card = document.createElement("a");
          card.className = "note-card";
          card.href = `reader.html?chapter=${encodeURIComponent(chapter.name)}`;
          card.innerHTML =
            `<span class="note-number">${String(index + 1).padStart(2, "0")}</span>` +
            `<span class="note-title">${chapter.name.replace(/^chap\s*/i, "Chapter ")}</span>`;
          chapterList.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        chapterList.innerHTML = "<p>Could not load chapters.</p>";
      }
    }

    loadChapters();
  </script>
</body>
</html>
