<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Notes</title>
  <link rel="stylesheet" href="site.css">
  <style>
    .note-cover { position: absolute; inset: 0; z-index: 1; border-radius: 16px; }
    .read-pill { position: relative; z-index: 2; justify-self: end; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 999px; background: #f1eefa; color: #6b5da7; font-size: .8rem; font-weight: 700; text-decoration: none; transition: background .15s ease; }
    .read-pill:hover { background: #e6def7; }
    @media (max-width: 560px) {
      .read-pill { grid-column: 2; justify-self: start; margin-top: 10px; }
    }
  </style>
</head>
<body>
  <main class="library">
    <nav class="topnav" aria-label="Site">
      <a class="nav-btn nav-btn--icon" href="/" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>
      </a>
    </nav>
    <p class="eyebrow">Personal reading library</p>
    <h1>Book notes</h1>
    <p class="intro">Open a book to read its chapter notes like a document, then use arrows or swipe to move through the collection.</p>
    <section class="note-list" aria-label="Notes">
      <div class="note-card">
        <a class="note-cover" href="chapters.html?book=forecasting" aria-label="Open Forecasting chapters"></a>
        <span class="note-number">01</span>
        <span class="note-title">Forecasting: Principles and Practice</span>
        <a class="read-pill" href="https://otexts.com/fpp3/" target="_blank" rel="noopener">Read it online ↗</a>
      </div>
    </section>
  </main>
</body>
</html>
