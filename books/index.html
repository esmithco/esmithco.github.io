<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Notes</title>
  <link rel="stylesheet" href="site.css">
  <style>
    .book-online { margin: 8px 4px 0; display: flex; justify-content: flex-end; }
    .book-online a { display: inline-flex; align-items: center; gap: 6px; color: #8a93a3; font-size: .82rem; font-weight: 700; text-decoration: none; }
    .book-online a:hover { gap: 10px; color: #6b5da7; transition: gap .15s ease, color .15s ease; }
  </style>
</head>
<body>
  <main class="library">
    <a class="home-link" href="../">← Brayan's home</a>
    <p class="eyebrow">Personal reading library</p>
    <h1>Book notes</h1>
    <p class="intro">Open a book to read its chapter notes like a document, then use arrows or swipe to move through the collection.</p>
    <section class="note-list" aria-label="Notes">
      <a class="note-card"
        href="chapters.html?book=forecasting"
        aria-label="Open Forecasting chapters">
        <span class="note-number">01</span>
        <span class="note-title">Forecasting: Principles and Practice</span>
        <span class="note-action">Chapters →</span>
      </a>
      <p class="book-online"><a href="https://otexts.com/fpp3/" target="_blank" rel="noopener">Read it online →</a></p>
    </section>
  </main>
</body>
</html>
