<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Notes</title>
  <link rel="stylesheet" href="site.css">
  <style>
    .note-cover { position: absolute; inset: 0; z-index: 1; border-radius: 16px; }
    .note-body { display: flex; flex-direction: column; align-items: flex-start; gap: 9px; }
    .read-pill { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px; background: #f1eefa; color: #6b5da7; font-size: .76rem; font-weight: 700; text-decoration: none; transition: background .15s ease; }
    .read-pill:hover { background: #e6def7; }
  </style>
</head>
<body>
  <main class="library">
    <a class="home-link" href="../">← Brayan's home</a>
    <p class="eyebrow">Personal reading library</p>
    <h1>Book notes</h1>
    <p class="intro">Open a book to read its chapter notes like a document, then use arrows or swipe to move through the collection.</p>
    <section class="note-list" aria-label="Notes">
      <div class="note-card">
        <a class="note-cover" href="chapters.html?book=forecasting" aria-label="Open Forecasting chapters"></a>
        <span class="note-number">01</span>
        <div class="note-body">
          <span class="note-title">Forecasting: Principles and Practice</span>
          <a class="read-pill" href="https://otexts.com/fpp3/" target="_blank" rel="noopener">Read it online ↗</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
