<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Taller de Aperturas</title>

<style>
/* One narrow column. Hub screen (home) + one screen per section, switched by #hash. Light palette shared with the site, violet accent. */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --ink:#172033; --muted:#55606F; --faint:#8A94A3; --line:#E3E7EF;
  --accent:#7C3AED; --accent-soft:#F1EAFE; --accent-ink:#FFFFFF;
  --sq-light:#EBECD0; --sq-dark:#739552;
  --good:#0E9488; --bad:#C2410C; --warn:#E8730C; --blue:#2563EB;
  --c-best:#16A34A; --c-good:#0E9488; --c-inacc:#CA8A04; --c-mist:#E8730C; --c-blun:#DC2626;
  --f-display:Georgia, "Times New Roman", serif;
  --f-body:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{font:600 .78rem var(--f-mono);letter-spacing:.04em;color:var(--accent);text-decoration:none}
.lang{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 .75rem var(--f-mono);letter-spacing:.06em;padding:6px 10px;border-radius:99px;cursor:pointer}
.eyebrow{font:600 .7rem var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:6px 0 6px}
h1{font-family:var(--f-display);font-weight:700;font-size:2.1rem;letter-spacing:-.04em;line-height:1;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{margin:0;font-size:1rem}
.sub{color:var(--muted);margin:8px 0 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.screen{display:flex;flex-direction:column;gap:14px}
.small{font-size:.85rem;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.88em}

/* home */
.hero{background:var(--accent);color:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 30px rgba(124,58,237,.25)}
.hero h2{color:#fff;font-size:1.6rem}
.hero p{margin:0;opacity:.9}
.hero .progress{background:rgba(255,255,255,.25)} .hero .progress span{background:#fff}
.hero .btn{background:#fff;color:var(--accent);border-color:#fff;font-size:1rem;padding:12px 18px;align-self:flex-start}
.hero .streak{font-size:.88rem;opacity:.95;min-height:1.2em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coach{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:12px 14px;margin:12px 0}.coach h3{margin:0 0 6px;font-size:1rem}.coach p{margin:6px 0;font-size:.92rem;line-height:1.4}.coach .btn{margin-left:4px}
.tile{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tc,var(--accent));border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;font:inherit;color:inherit}
.tile b{font-family:var(--f-display);font-size:1.1rem}
.tile span{font-size:.84rem;color:var(--muted)}
.tile em{font-style:normal;font:600 .72rem var(--f-mono);color:var(--tc,var(--accent));margin-top:auto}
.link{appearance:none;background:none;border:0;color:var(--accent);font:600 .9rem var(--f-body);cursor:pointer;padding:6px 0;text-align:left}

/* trainer */
.trhead{display:flex;align-items:center;gap:10px}
.trhead .progress{flex:1}
.prompt{font-size:1rem}
.prompt .op{margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-block;font:600 .72rem var(--f-body);padding:2px 9px;border-radius:99px;color:#fff;background:var(--muted);white-space:nowrap}
.pill.mist{background:var(--c-mist)} .pill.blun{background:var(--c-blun)} .pill.good{background:var(--good)} .pill.rep{background:var(--blue)} .pill.idea{background:var(--accent)}
.ideaT{font-family:var(--f-display);font-size:1.25rem;margin:2px 0 6px}
.ideaB{margin:0 0 8px;padding-left:20px;color:var(--ink)} .ideaB li{margin:3px 0}
.boardwrap{position:relative;display:flex;gap:8px;align-self:center;width:100%;max-width:560px}
.evalbar{position:relative;width:22px;flex:0 0 22px;border-radius:5px;overflow:hidden;background:#2b2b2b;display:flex;flex-direction:column;justify-content:flex-end}
.evalbar.flip{flex-direction:column-reverse}
.evalbar .fill{background:#f4f4f4;height:50%;transition:height .5s ease}
.evalbar .txt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);font:700 10px/1 var(--f-mono);color:#fff;background:var(--accent);padding:3px 5px;border-radius:5px;white-space:nowrap}
.evalbar.pulse{animation:pulse .9s ease}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.7)}100%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
.bwrap{position:relative;flex:1;min-width:0}
.board{position:relative;width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border-radius:6px;overflow:hidden;box-shadow:0 10px 26px rgba(23,32,51,.14);user-select:none;-webkit-user-select:none;touch-action:none}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sq{position:relative;min-width:0;min-height:0}
.sq.l{background:var(--sq-light)} .sq.d{background:var(--sq-dark)}
.sq .pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sq.last{box-shadow:inset 0 0 0 999px rgba(246,246,105,.5)}
.sq.sel{box-shadow:inset 0 0 0 999px rgba(124,58,237,.35)}
.sq.hint{box-shadow:inset 0 0 0 4px var(--warn)}
.sq.ok{box-shadow:inset 0 0 0 999px rgba(14,148,136,.5)}
.sq.bad{box-shadow:inset 0 0 0 999px rgba(194,65,12,.5)}
.sq.drag-from .pc{opacity:.25}
.sq .dot{position:absolute;left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.18);pointer-events:none}
.sq .ring{position:absolute;inset:4%;border-radius:50%;box-shadow:inset 0 0 0 5px rgba(0,0,0,.18);pointer-events:none}
.sq .cf,.sq .cr{position:absolute;font:700 10px/1 var(--f-mono);pointer-events:none}
.sq .cf{right:3px;bottom:3px} .sq .cr{left:3px;top:3px}
.sq.l .cf,.sq.l .cr{color:var(--sq-dark)} .sq.d .cf,.sq.d .cr{color:var(--sq-light)}
.ghost{position:absolute;pointer-events:none;z-index:5;width:12.5%;height:12.5%;transform:translate(-50%,-50%) scale(1.12);filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.line{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.feedback{min-height:1.4em;font-weight:600}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.chip{display:inline-block;font:600 .8rem var(--f-body);padding:2px 9px;border-radius:8px;color:#fff;margin:2px 4px 2px 0}
.chip.best{background:var(--c-best)} .chip.good{background:var(--c-good)} .chip.inacc{background:var(--c-inacc)} .chip.mist{background:var(--c-mist)} .chip.blun{background:var(--c-blun)}
.note{display:flex;flex-direction:column;gap:6px}
.note p{margin:0;padding:8px 12px;border-radius:10px;font-size:.92rem;background:var(--surface);border:1px solid var(--line)}
.note p.me{border-left:4px solid var(--good)} .note p.opp{border-left:4px solid var(--muted)}
.why{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:.93rem}
.why h3{font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}
.why ul{margin:0;padding-left:18px} .why li{margin:5px 0}
.choices{display:flex;flex-direction:column;gap:8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9rem var(--f-body);padding:9px 14px;border-radius:10px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.opt{text-align:left}
.btn.okb{background:var(--good);border-color:var(--good);color:#fff} .btn.badb{background:var(--bad);border-color:var(--bad);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px}
.exbar{background:#EEF3FF;border:1px solid #CFDCFB;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.end{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* lists */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;font:600 .92rem var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.lrow{appearance:none;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font:inherit;color:inherit}
.lrow .lname{flex:1;display:flex;flex-direction:column;gap:2px;font-weight:600;min-width:0}
.lrow .lname .small,.lrow .lname .mono{font-weight:400}
.dotst{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--line)}
.dotst.new{background:var(--line)} .dotst.due{background:var(--warn)} .dotst.ok{background:var(--good)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
.chk{display:flex;align-items:center;gap:6px;font-size:.9rem}
textarea,input[type=text],select{max-width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:400 .9rem var(--f-body)}
textarea{width:100%;min-height:110px;resize:vertical;font-family:var(--f-mono);font-size:.82rem}
label.f{font-weight:600;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
details summary{cursor:pointer;font-weight:600}
/* app shell: bottom tab bar, close button */
.wrap{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{appearance:none;background:none;border:0;flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font:600 .72rem var(--f-body);color:var(--faint);cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.close{text-decoration:none}a.close{color:var(--ink)}
.close{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:36px;height:36px;border-radius:50%;font:600 1.1rem var(--f-body);cursor:pointer;display:flex;align-items:center;justify-content:center}
.toptitle{font:700 1.05rem var(--f-display);flex:1;text-align:left}
.sync{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sync .small{flex:1}
.unit{display:flex;flex-direction:column;gap:8px}
.unit h3{font:600 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:6px}
.bar2{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.bar2 span{display:block;height:100%;background:var(--good)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font:700 1.45rem var(--f-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 6px}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:.82rem;color:var(--muted);margin:2px 0 6px}
.cloudline{appearance:none;background:none;border:0;padding:0;font:600 .82rem var(--f-body);color:var(--good);cursor:pointer;text-align:left}.cloudline.warn{color:var(--warn)}
.steps{margin:0;padding-left:20px}.steps li{margin:4px 0}.steps a{color:var(--accent)}
.board.nocoords .cf,.board.nocoords .cr{display:none}
.bigq{font:600 1.35rem var(--f-body);margin:4px 0}.bigq b{font-size:1.6rem;color:var(--accent)}
.choices.grid{display:grid;grid-template-columns:1fr 1fr}
.sq.sel{box-shadow:inset 0 0 0 999px rgba(124,58,237,.55)}
.anbar{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.anmoves{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:2px;align-items:center;font:600 .85rem var(--f-mono);scrollbar-width:none;padding-bottom:2px}
.anmoves .mn{color:var(--faint);margin:0 2px 0 6px;font-weight:400}
.anmoves .mv{appearance:none;border:0;background:none;font:inherit;color:var(--ink);padding:3px 5px;border-radius:6px;cursor:pointer;white-space:nowrap}
.anmoves .mv.new{color:var(--accent)} .anmoves .mv.cur{background:var(--accent);color:#fff}
.annav{display:flex;gap:6px;flex-wrap:wrap} .annav .btn{padding:8px 14px;font-size:1rem}
.aneval{min-height:1.2em}
.trhead .small-btn{padding:5px 10px;font-size:.8rem;white-space:nowrap}
.odot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.board.nopieces .pc{visibility:hidden}
.clockrow{display:flex;align-items:center;gap:10px}.clockrow .timer{flex:1}.clock{font:700 1.3rem ui-monospace,Menlo,monospace;background:#1e2631;color:#fff;border-radius:8px;padding:4px 10px;min-width:78px;text-align:center}.clock.low{background:#C0392B}
.why li:has(.teach){list-style:none;margin-left:-1.1em}
.fold{margin:4px 0}.fold summary{cursor:pointer;font-weight:600;color:var(--accent);padding:4px 0}.fold summary::marker{color:var(--accent)}
.teach{background:var(--accent-soft,#F3EEFF);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin:4px 0 8px}.teach p{margin:6px 0}.teachT{font-weight:700;font-size:1.02rem}
.story{margin:4px 0 2px;padding-left:4px;list-style:none}.story li{margin:3px 0;line-height:1.4}.story li.op{color:var(--muted)}.feedback:empty{display:none}
.timer{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.timer span{display:block;height:100%;width:100%;background:var(--good);transition:width .1s linear}.timer span.low{background:var(--c-blun)}
.counter{font:600 .85rem var(--f-mono);color:var(--muted)}
@media (max-width:420px){.tiles{grid-template-columns:1fr 1fr}.tile{padding:12px}.evalbar{width:16px;flex-basis:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
