*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}

textarea{width:100%;min-height:96px;resize:vertical;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:400 .98rem/1.45 var(--f-body)}

.fb{border-left:3px solid var(--accent);padding:6px 0 6px 12px;color:var(--ink);white-space:pre-wrap}

.why{border-left:3px solid var(--line);padding:4px 0 4px 12px;color:var(--muted)}
.result{font-weight:700} .result.ok{color:var(--good)} .result.no{color:var(--bad)}
.small{font-size:.85rem;color:var(--muted)}
.lib{display:flex;flex-direction:column;gap:18px}

.libitem .nm{font-weight:600}
.libitem .dd{grid-column:1/-1;color:var(--muted);font-size:.92rem}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.entry .meta{font:600 .72rem var(--f-mono);color:var(--muted);letter-spacing:.04em}
.lesson{font-size:1.02rem;white-space:pre-wrap}

.topics{display:flex;flex-wrap:wrap;gap:6px}
.topics .btn{padding:6px 10px;font-size:.82rem}
.problem{font-size:2.2rem;font-weight:700;text-align:center;padding:10px 0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ans{flex:1;min-width:0;font-size:1.6rem;text-align:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.timebar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.timebar span{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.calcfb{min-height:1.6em;text-align:center}
.calcstats{grid-template-columns:repeat(3,minmax(0,1fr))}
.chart{margin:0}.chart svg{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}.chart .grid{stroke:var(--line);stroke-dasharray:3 4}.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent)}.chart .lbl{fill:var(--muted);font:11px var(--f-mono)}
.lvls{display:flex;flex-direction:column;gap:6px}.lvl{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.mono{font-family:var(--f-mono)}
.syl{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:2px}
.syl li.done{color:var(--muted)}
.syl li.now{font-weight:700}
.linkbtn{appearance:none;border:0;background:none;color:inherit;font:inherit;padding:2px 0;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.done-hero{text-align:center;padding:10px 0}
.done-hero .big{font:700 3rem var(--f-display);color:var(--accent);line-height:1}
@media (max-width:480px){.problem{font-size:1.8rem}.calcstats{grid-template-columns:repeat(3,minmax(0,1fr))}.persp{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.choices{grid-template-columns:1fr}.pair{grid-template-columns:1fr}.pair .plus{text-align:center}h1{font-size:1.9rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

(function(){

/* ---------------- content ---------------- */
var AREAS={m:{es:'Matemáticas',en:'Math'},p:{es:'Probabilidad y estadística',en:'Probability & statistics'},e:{es:'Economía y decisiones',en:'Economics & decisions'},s:{es:'Psicología y sesgos',en:'Psychology & biases'},l:{es:'Lógica y argumentos',en:'Logic & arguments'},c:{es:'Sistemas y ciencia',en:'Systems & science'}};
var C=[
 ['exp','m','Crecimiento exponencial','Exponential growth','Algo crece en proporción a su tamaño actual, así que se duplica en tiempos iguales. Regla del 72: años para duplicar ≈ 72 ÷ % de crecimiento anual.','Something grows in proportion to its current size, so it doubles in equal time steps. Rule of 72: years to double ≈ 72 ÷ annual growth rate in %.','Al 8% anual, un ahorro se duplica en unos 9 años.','At 8% a year, savings double in about 9 years.'],
 ['log','m','Pensamiento logarítmico','Logarithmic thinking','Cuando las cantidades varían en órdenes de magnitud, compara proporciones, no diferencias: de 10 a 100 es el mismo salto que de 100 a 1.000.','When quantities span orders of magnitude, compare ratios, not differences: 10 to 100 is the same jump as 100 to 1,000.','Un sismo de magnitud 7 tiene 10 veces la amplitud de uno de 6.','A magnitude 7 earthquake has 10 times the amplitude of a 6.'],
 ['fermi','m','Estimación de Fermi','Fermi estimation','Parte una pregunta "imposible" en factores que sí puedes estimar y multiplícalos; los errores de cada factor tienden a compensarse.','Break an "impossible" question into factors you can estimate and multiply them; errors in each factor tend to cancel out.','¿Cuántas motos hay en Bogotá? Hogares × fracción con moto × motos por hogar.','How many motorcycles are in Bogotá? Households × share with a bike × bikes per household.'],
 ['invariant','m','Invariantes','Invariants','Busca una cantidad que no cambia aunque el sistema cambie; suele resolver problemas que parecen complicados.','Look for a quantity that stays the same while everything else changes; it often cracks problems that look complicated.','Un tablero sin dos esquinas opuestas no se cubre con dominós: cada ficha tapa una blanca y una negra, y faltan dos del mismo color.','A chessboard missing two opposite corners can\'t be tiled with dominoes: each tile covers one light and one dark square, and both missing squares share a color.'],
 ['pigeon','m','Principio del palomar','Pigeonhole principle','Si repartes n+1 objetos en n cajas, al menos una caja tiene dos o más.','If you put n+1 items into n boxes, at least one box holds two or more.','En un grupo de 367 personas, dos cumplen años el mismo día con total seguridad.','In any group of 367 people, two share a birthday, guaranteed.'],
 ['extreme','m','Casos extremos','Extreme cases','Prueba una idea con valores límite (0, 1, muy grande) para ver si sigue teniendo sentido; es la forma más rápida de detectar una fórmula mala.','Test an idea with boundary values (0, 1, huge) to see if it still makes sense; it\'s the fastest way to catch a broken formula.','Si una fórmula de descuento da precio negativo al 100% de descuento, está mal.','If a discount formula gives a negative price at 100% off, it\'s wrong.'],
 ['nonlin','m','No linealidad','Nonlinearity','El efecto no es proporcional a la causa: hay umbrales, saturación y rendimientos decrecientes.','Effects aren\'t proportional to causes: there are thresholds, saturation and diminishing returns.','Dormir 5 horas no te deja al 60%: el rendimiento cae mucho más.','Sleeping 5 hours doesn\'t leave you at 60%: performance drops far more.'],
 ['network','m','Redes y nodos clave','Networks and hubs','Muchos sistemas son nodos y conexiones; los nodos muy conectados dominan cómo se propaga algo.','Many systems are nodes and links; highly connected hubs dominate how things spread.','Un rumor se riega rápido si llega a la persona que habla con todos.','A rumor spreads fast once it reaches the person who talks to everyone.'],
 ['base','p','Tasa base','Base rate','Antes de mirar la evidencia, pregunta qué tan común es el caso en general; ignorarlo es la falacia de la tasa base.','Before looking at the evidence, ask how common the thing is in general; ignoring that is the base-rate fallacy.','Con una enfermedad de 1 en 10.000, casi todos los positivos de una prueba "99% precisa" son falsos.','With a 1-in-10,000 disease, almost every positive from a "99% accurate" test is false.'],
 ['bayes','p','Actualización bayesiana','Bayesian updating','Tu nueva creencia = la previa ajustada por cuánto más probable es la evidencia si la hipótesis es cierta que si no lo es.','Your new belief = your prior, adjusted by how much more likely the evidence is if the hypothesis is true than if it isn\'t.','Un colega puntual llega tarde: es más probable un imprevisto que descuido.','A punctual coworker is late: an incident is likelier than carelessness.'],
 ['regress','p','Regresión a la media','Regression to the mean','Tras un resultado extremo suele venir uno más normal, por puro azar, aunque nada haya cambiado.','An extreme result is usually followed by a more ordinary one, by chance alone, even if nothing changed.','Después de tu peor semana en ajedrez, la siguiente suele ser mejor, entrenes o no.','After your worst chess week, the next one is usually better, whether you train or not.'],
 ['lln','p','Ley de los grandes números','Law of large numbers','Con muchas observaciones el promedio se acerca al valor real; con pocas, domina el azar.','With many observations the average approaches the true value; with few, luck dominates.','5 partidas no dicen nada de una apertura; 200 sí.','5 games tell you nothing about an opening; 200 do.'],
 ['corr','p','Correlación no es causalidad','Correlation isn\'t causation','Dos cosas que se mueven juntas pueden tener una causa común, ir al revés o ser casualidad.','Two things moving together may share a hidden cause, run the other way, or be coincidence.','Helados y ahogamientos suben juntos porque ambos dependen del calor.','Ice cream sales and drownings rise together because both follow hot weather.'],
 ['surv','p','Sesgo de supervivencia','Survivorship bias','Solo ves los casos que pasaron el filtro; los que fracasaron no aparecen en los datos.','You only see the cases that made it through the filter; the failures never show up in the data.','En la II Guerra se reforzaron los aviones donde los que volvían NO tenían agujeros.','In WWII, planes were armored where returning planes had NO holes.'],
 ['selection','p','Sesgo de selección','Selection bias','La muestra no representa a la población porque la forma de elegirla está ligada al resultado.','The sample doesn\'t represent the population because how it was chosen is tied to the outcome.','Una encuesta en Instagram sobre cuánto usa la gente Instagram.','An Instagram poll about how much people use Instagram.'],
 ['ev','p','Valor esperado','Expected value','Promedio de los resultados posibles ponderados por su probabilidad; guía las decisiones que se repiten.','The average of possible outcomes weighted by their probabilities; it guides decisions you make repeatedly.','10% de ganar 1.000.000 vale en promedio 100.000.','A 10% shot at 1,000,000 is worth 100,000 on average.'],
 ['var','p','Varianza y riesgo','Variance and risk','Dos opciones con el mismo promedio pueden tener riesgos muy distintos; importa la dispersión, no solo la media.','Two options with the same average can carry very different risk; the spread matters, not just the mean.','Sueldo fijo vs comisiones con el mismo promedio anual.','A fixed salary vs commissions with the same yearly average.'],
 ['fat','p','Colas pesadas','Fat tails','En algunos fenómenos los extremos son mucho más frecuentes de lo que predice la curva normal y dominan el total.','In some phenomena extremes are far more common than the normal curve predicts, and they dominate the total.','Unas pocas películas o libros concentran la mayoría de las ventas.','A few films or books make most of the sales.'],
 ['simpson','p','Paradoja de Simpson','Simpson\'s paradox','Una tendencia que aparece en cada grupo puede invertirse al juntarlos, por cómo se reparten los casos.','A trend that shows up in every group can reverse when the groups are combined, because of how cases are distributed.','Un hospital mejor con graves y con leves puede verse peor en total si atiende muchos más graves.','A hospital better for both severe and mild cases can look worse overall if it treats far more severe ones.'],
 ['opp','e','Costo de oportunidad','Opportunity cost','El verdadero costo de algo es la mejor alternativa a la que renuncias por elegirlo.','The real cost of anything is the best alternative you give up to get it.','Un trabajo extra el sábado cuesta también las horas de estudio que pierdes.','Saturday overtime also costs the study hours you lose.'],
 ['marg','e','Pensamiento marginal','Marginal thinking','Decide mirando el beneficio y el costo de una unidad más, no el total.','Decide by looking at the benefit and cost of one more unit, not the total.','La quinta hora de estudio rinde menos que la primera.','Your fifth hour of study yields less than your first.'],
 ['sunk','e','Costo hundido','Sunk cost','Lo ya gastado no se recupera, así que no debería pesar al decidir si seguir.','What\'s already spent is gone, so it shouldn\'t weigh on whether to continue.','Seguir viendo una película mala porque ya pagaste la entrada.','Sitting through a bad movie because you already paid.'],
 ['incent','e','Incentivos','Incentives','La gente responde a lo que se premia y se castiga; para predecir conductas, mira los incentivos.','People respond to what gets rewarded and punished; to predict behavior, look at the incentives.','Pagar por líneas de código produce código innecesariamente largo.','Paying per line of code produces needlessly long code.'],
 ['second','e','Efectos de segundo orden','Second-order effects','Pregunta "¿y después qué?": las consecuencias de las consecuencias suelen ser las importantes.','Ask "and then what?": the consequences of the consequences are often what matters.','Ampliar una vía atrae más carros y vuelve el trancón.','Widening a road attracts more cars and the traffic jam returns.'],
 ['compadv','e','Ventaja comparativa','Comparative advantage','Conviene especializarse en lo que haces con menor costo de oportunidad, aunque otro sea mejor en todo.','It pays to specialize in what you do at the lowest opportunity cost, even if someone else is better at everything.','Un abogado que digita rápido igual contrata un asistente: su hora vale más en casos.','A lawyer who types fast still hires an assistant: their hour is worth more on cases.'],
 ['goodhart','e','Ley de Goodhart','Goodhart\'s law','Cuando una medida se convierte en meta, deja de ser una buena medida.','When a measure becomes a target, it stops being a good measure.','Premiar llamadas cortas en un call center produce llamadas cortas sin resolver.','Rewarding short calls in a call center produces short, unresolved calls.'],
 ['confirm','s','Sesgo de confirmación','Confirmation bias','Buscamos y recordamos lo que confirma lo que ya creemos, e ignoramos lo que lo contradice.','We seek and remember what confirms what we already believe, and ignore what contradicts it.','Revisar solo las partidas que ganaste con tu apertura favorita.','Reviewing only the games you won with your favorite opening.'],
 ['anchor','s','Anclaje','Anchoring','El primer número que oímos arrastra nuestras estimaciones, aunque sea arbitrario.','The first number we hear drags our estimates toward it, even if it\'s arbitrary.','En una negociación salarial, la primera cifra marca toda la discusión.','In a salary negotiation, the first number frames the whole discussion.'],
 ['avail','s','Heurística de disponibilidad','Availability heuristic','Juzgamos qué tan frecuente es algo por lo fácil que nos viene un ejemplo a la mente.','We judge how common something is by how easily an example comes to mind.','Tras ver noticias de un accidente aéreo, volar parece más peligroso que manejar.','After plane-crash news, flying feels more dangerous than driving.'],
 ['overconf','s','Exceso de confianza','Overconfidence','Creemos saber y predecir mejor de lo que realmente lo hacemos; los proyectos casi siempre tardan más de lo planeado.','We think we know and predict better than we do; projects almost always take longer than planned.','"Esto me toma dos semanas", y toma cuatro, otra vez.','"This will take two weeks," and it takes four, again.'],
 ['loss','s','Aversión a la pérdida','Loss aversion','Perder algo duele más o menos el doble de lo que alegra ganar lo mismo.','Losing something hurts roughly twice as much as gaining the same thing feels good.','No vender una acción que cayó para no "hacer real" la pérdida.','Holding a falling stock so the loss doesn\'t "become real."'],
 ['framing','s','Efecto de encuadre','Framing effect','La misma información presentada de otra forma cambia la decisión.','The same information presented differently changes the decision.','"90% de supervivencia" convence más que "10% de mortalidad".','"90% survival" persuades more than "10% mortality."'],
 ['hindsight','s','Sesgo retrospectivo','Hindsight bias','Cuando ya conocemos el resultado, creemos que era predecible desde el principio.','Once we know the outcome, we believe it was predictable all along.','"Era obvio que íbamos a perder", dicho después del partido.','"It was obvious we\'d lose," said after the match.'],
 ['falsif','l','Falsabilidad','Falsifiability','Una afirmación útil dice qué observación la demostraría falsa; si nada puede refutarla, no informa nada.','A useful claim states what observation would prove it wrong; if nothing could refute it, it tells you nothing.','"Esta semana tendrás retos y oportunidades" nunca falla, por eso no sirve.','"This week brings challenges and opportunities" can\'t fail, so it\'s useless.'],
 ['occam','l','Navaja de Occam','Occam\'s razor','Entre explicaciones que encajan igual, prefiere la que necesita menos suposiciones.','Among explanations that fit equally well, prefer the one with fewer assumptions.','El wifi se cae con el microondas: interferencia, no hackers.','Wi-Fi drops when the microwave runs: interference, not hackers.'],
 ['necsuf','l','Necesario vs suficiente','Necessary vs sufficient','Necesario: sin eso no ocurre. Suficiente: con eso basta. Confundirlos lleva a falsas expectativas.','Necessary: without it, it won\'t happen. Sufficient: it\'s enough on its own. Mixing them up creates false expectations.','Saber Python es necesario para ciencia de datos, no suficiente para que te contraten.','Knowing Python is necessary for data science, not sufficient to get hired.'],
 ['converse','l','Afirmar el consecuente','Affirming the consequent','"Si A, entonces B" y "pasó B" no prueban A: B puede tener otras causas.','"If A then B" plus "B happened" doesn\'t prove A: B may have other causes.','Si llueve, la calle se moja; la calle está mojada, pero pudo ser el riego.','If it rains, the street gets wet; the street is wet, but it could be the sprinklers.'],
 ['strawman','l','Hombre de paja','Straw man','Refutar una versión débil del argumento contrario en vez del argumento real. Lo opuesto: hombre de acero.','Refuting a weak version of the other side\'s argument instead of the real one. The opposite: steelmanning.','"Quieres trabajo remoto, o sea que no quieres trabajar."','"You want remote work, so you don\'t want to work."'],
 ['invert','l','Inversión','Inversion','Piensa al revés: ¿qué garantizaría el fracaso? Luego evita eso.','Think backwards: what would guarantee failure? Then avoid that.','Para mejorar en ajedrez: ¿qué me hace perder rápido? Comer peones envenenados.','To get better at chess: what makes me lose fast? Grabbing poisoned pawns.'],
 ['feedback','c','Ciclos de retroalimentación','Feedback loops','Positivos: el efecto se amplifica a sí mismo. Negativos: el sistema se corrige y se estabiliza.','Positive loops amplify themselves; negative loops correct and stabilize the system.','Un video con vistas recibe más recomendaciones y más vistas.','A video with views gets recommended more, and gets more views.'],
 ['bottleneck','c','Cuello de botella','Bottleneck','El rendimiento total lo limita la parte más lenta; mejorar las demás no ayuda.','Total throughput is limited by the slowest step; improving the others doesn\'t help.','Si la lectura de datos toma 2 h de 3, optimizar lo demás casi no cambia nada.','If reading data takes 2 of 3 hours, optimizing the rest barely matters.'],
 ['emerg','c','Emergencia','Emergence','Propiedades del conjunto que no tiene ninguna parte por separado y que surgen de reglas simples.','Properties of the whole that no single part has, arising from simple rules.','Un trancón aparece sin que ningún conductor lo cause.','A traffic jam appears without any single driver causing it.'],
 ['entropy','c','Entropía','Entropy','En un sistema aislado el desorden tiende a aumentar; por analogía, todo lo ordenado necesita mantenimiento.','In an isolated system disorder tends to increase; by analogy, anything orderly needs upkeep.','Un código o una casa sin mantenimiento se degradan solos.','Code or a house without upkeep degrades on its own.'],
 ['pareto','c','Principio de Pareto (80/20)','Pareto principle (80/20)','En muchos sistemas una minoría de causas produce la mayoría de los efectos.','In many systems a minority of causes produces most of the effects.','3 de 50 tipos de error generan el 80% de los tickets.','3 of 50 error types cause 80% of the tickets.'],
 ['control','c','Grupo de control','Control group','Para saber si algo funciona, compáralo con un grupo parecido que no lo recibió; sin eso no sabes qué lo causó.','To know if something works, compare against a similar group that didn\'t get it; otherwise you can\'t tell what caused the change.','Los estudios de ajedrez en colegios mostraron efecto solo cuando no había un buen grupo de control.','School chess studies showed effects only when there was no proper control group.']

/* ---------------- state ---------------- */
var KEY='gimnasio-mental.v1',DAYS=[0,1,3,7,16,35,80];
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayNum(s){var p=s.split('-');return Math.round(new Date(+p[0],p[1]-1,+p[2]).getTime()/864e5)}
function blank(){return {lang:'es',npd:2,cards:{},cases:{},journal:[],days:[],facts:{},lessons:[],ti:0}}
var S=blank();
try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(blank(),JSON.parse(raw))}}catch(e){}
var DOC=null,syncTimer=null,syncState='';
function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(DOC){clearTimeout(syncTimer);syncTimer=setTimeout(push,1500)}}
function push(){if(!DOC)return;DOC.set({json:JSON.stringify(S),updated:S.updated||Date.now()}).then(function(){syncState='ok';showSync()}).catch(function(){syncState='err';showSync()})}
function showSync(){var e=document.getElementById('sync');if(!e)return;e.textContent=syncState==='ok'?t('synced'):syncState==='err'?t('syncErr'):'';}
function startSync(){
  if(!(window.claude&&window.claude.use))return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){var db=r[0],u=r[1];if(!db||!u)return null;
    return u.id().then(function(id){if(!id)return;DOC=db.doc('data/users/'+id+'/state');
      return DOC.get().then(function(snap){var remote=null;try{if(snap.exists&&snap.data().json)remote=JSON.parse(snap.data().json)}catch(e){}
        if(remote&&(remote.updated||0)>(S.updated||0)){S=Object.assign(blank(),remote);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}stopCalc();cur=null;syncState='ok';applyLang()}
        else if(Object.keys(S.cards).length||S.days.length){push()}else{syncState='ok';showSync()}});
    })}).catch(function(){});
}
function L(){return S.lang}
function t(k,vars){var s=(T[L()][k]||k);if(vars)Object.keys(vars).forEach(function(v){s=s.replace('{'+v+'}',vars[v])});return s}
function cn(id){return CONCEPTS[id].n[L()]}
function isFact(id){return id.indexOf('f:')===0}

/* ---------------- sample (Claude feedback, optional) ---------------- */
var sample=null;
if(window.claude&&window.claude.use){window.claude.use('sample').then(function(s){sample=s;if(cur)render()}).catch(function(){})}

/* ---------------- scheduling ---------------- */
function dueToday(){var n=dayNum(today());return Object.keys(S.cards).filter(function(id){return S.cards[id].due<=n})}
function unseen(){return C.map(function(r){return r[0]}).filter(function(id){return !S.cards[id]})}
function conceptIds(){return Object.keys(S.cards).filter(function(id){return !isFact(id)})}
function grade(id,r){
  var c=S.cards[id];var n=dayNum(today());
  if(r===0){c.box=1;c.lapses=(c.lapses||0)+1}else if(r===2){c.box=Math.min(6,c.box+1)}else{c.box=Math.max(1,c.box)}
  c.due=n+(r===1?Math.max(1,Math.ceil(DAYS[c.box]/2)):DAYS[c.box]);c.reps=(c.reps||0)+1;save();
}
function introduce(id){S.cards[id]={box:1,due:dayNum(today())+1,reps:0,lapses:0};save()}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function pickCases(n){
  var all=K.map(function(r){return r[0]});var now=dayNum(today());
  var score=function(id){var s=S.cases[id];if(!s)return 0;return (s.ok&&s.last===now?100:0)+(s.ok?10+Math.min(20,now-(s.last||0))*-1:-5)};
  return shuffle(all).sort(function(a,b){return score(a)-score(b)}).slice(0,n);
}
function pickPair(){
  var pool=conceptIds();if(pool.length<4)pool=C.map(function(r){return r[0]});
  var a=pool[Math.floor(Math.random()*pool.length)];var others=pool.filter(function(x){return CONCEPTS[x].area!==CONCEPTS[a].area});
  return [a,others[Math.floor(Math.random()*others.length)]];
}

/* ---------------- session ---------------- */
var cur=null;
function newSession(){
  var dueAll=shuffle(dueToday());var due=dueAll.filter(function(x){return !isFact(x)}).slice(0,5).concat(dueAll.filter(isFact).slice(0,3));var fresh=unseen().slice(0,S.npd);
  var items=due.map(function(id){return {id:id,kind:'review'}}).concat(fresh.map(function(id){return {id:id,kind:'new'}}));
  cur={block:0,items:items,i:0,revealed:false,text:'',fb:null,pair:pickPair(),connText:'',cases:pickCases(3),ci:0,answered:null,lesson:null,topic:TOPICS[S.ti%TOPICS.length][0]};
}
function stats(){
  var ids=conceptIds();$('sLearned').textContent=ids.length;
  $('sMastered').textContent=ids.filter(function(id){return S.cards[id].box>=4}).length;
  var tot=0,ok=0;Object.keys(S.cases).forEach(function(k){tot+=S.cases[k].n||0;ok+=S.cases[k].okN||0});
  $('sAcc').textContent=tot?Math.round(ok/tot*100)+'%':'–';
  var days=S.days.slice().sort(),streak=0,d=dayNum(today());
  var set={};days.forEach(function(x){set[dayNum(x)]=1});if(!set[d])d--;while(set[d]){streak++;d--}
  $('sStreak').textContent=streak;return streak;
}
function areaTag(id){var a=CONCEPTS[id].area;return '<span class="area '+a+'">'+esc(AREAS[a][L()])+'</span>'}
function defBox(id){var c=CONCEPTS[id];return '<div class="def"><p>'+esc(c.d[L()])+'</p><p class="ex">'+esc(c.x[L()])+'</p></div>'}
function steps(){var s=$('steps').children;$('steps').hidden=!!(cur&&cur.standalone);for(var i=0;i<5;i++){s[i].className=!cur?'':i<cur.block-1?'done':i===cur.block-1?'on':''}}
function render(){
  stats();steps();var st=$('stage');
  if(!cur){var r=Math.min(8,dueToday().length),n=Math.min(S.npd,unseen().length);
    st.innerHTML='<h2>'+t('start')+'</h2><p class="small">'+t('startSub')+'</p><p>'+t('todayPlan',{r:r,n:n})+'</p><div class="row"><button class="btn primary" id="go">'+t('start')+'</button><button class="btn" id="goCalc">'+t('calcOnly')+'</button></div><p class="small" id="sync"></p>';showSync();
    $('goCalc').onclick=startCalcOnly;
    $('go').onclick=function(){newSession();cur.block=1;if(!cur.items.length)cur.block=2;render()};return}
  if(cur.block===1)return renderRecall(st);
  if(cur.block===2)return renderCalc(st);
  if(cur.block===3)return renderConnect(st);
  if(cur.block===4)return renderApply(st);
  if(cur.block===5)return renderDiscover(st);
  return renderDone(st);
}
function head(k,extra){return '<div class="blockhead"><span class="kicker">'+t(k)+' · '+t('min')+'</span><span class="small">'+(extra||'')+'</span></div>'}
function fbHtml(){if(!cur.fb)return '';return '<div class="fb'+(cur.fb.wait?' wait':'')+'" id="fbOut">'+esc(cur.fb.text)+'</div>'}
function askClaude(prompt){
  if(!sample)return;cur.fb={wait:true,text:t('fbWait')};render();
  sample(prompt,{cache:false,modelTier:'quick',onText:function(u){cur.fb={wait:false,text:u.text};var o=$('fbOut');if(o){o.textContent=u.text;o.className='fb'}}})
  .then(function(r){cur.fb={wait:false,text:r.text};render()})
  .catch(function(e){cur.fb={wait:false,text:t('fbErr')};render()});
}
function langLine(){return L()==='en'?'Reply in English. If the learner wrote in English and made a real grammar or word-choice error, add one line at the end starting with "English fix:" with the single most useful correction (American English).':'Responde en español. Si el estudiante escribió en inglés y cometió un error real de gramática o vocabulario, agrega al final una línea "English fix:" con la corrección más útil (inglés americano).'}
function renderRecall(st){
  var it=cur.items[cur.i];if(isFact(it.id))return renderFact(st,it);var c=CONCEPTS[it.id];
  var h=head('b1',(cur.i+1)+' / '+cur.items.length)+'<div class="row">'+areaTag(it.id)+' <span class="small">'+(it.kind==='new'?t('newC'):t('review'))+'</span></div><div class="concept">'+esc(c.n[L()])+'</div>';
  if(it.kind==='new'){
    h+=defBox(it.id)+'<p class="small">'+t('newHelp')+'</p><div class="row"><button class="btn primary" id="ok">'+t('gotIt')+'</button></div>';
    st.innerHTML=h;$('ok').onclick=function(){introduce(it.id);nextItem()};return;
  }
  h+='<p>'+t('recallQ')+'</p><textarea id="rt" placeholder="'+esc(t('recallPh'))+'" aria-label="'+esc(t('recallQ'))+'">'+esc(cur.text)+'</textarea>';
  if(!cur.revealed){h+='<div class="row"><button class="btn primary" id="rv">'+t('reveal')+'</button></div>';st.innerHTML=h;
    $('rt').oninput=function(e){cur.text=e.target.value};$('rv').onclick=function(){cur.text=$('rt').value;cur.revealed=true;render()};return}
  h+=defBox(it.id)+fbHtml();
  h+='<div class="row">'+(sample&&cur.text.trim().length>15&&!cur.fb?'<button class="btn" id="fb">'+t('feedback')+'</button>':'')+
     '<button class="btn rate-0" data-r="0">'+t('rate0')+'</button><button class="btn rate-1" data-r="1">'+t('rate1')+'</button><button class="btn rate-2" data-r="2">'+t('rate2')+'</button></div>';
  st.innerHTML=h;$('rt').oninput=function(e){cur.text=e.target.value};
  if($('fb'))$('fb').onclick=function(){askClaude('You are a concise, honest tutor. Concept: "'+c.n.en+'". Reference definition: '+c.d.en+' Example: '+c.x.en+'\nThe learner explained it from memory:\n"""'+cur.text+'"""\nIn 2-4 short sentences: say what they got right, the single most important thing missing or wrong, and whether their own example fits. No praise filler. '+langLine())};
  st.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){grade(it.id,+b.getAttribute('data-r'));nextItem()}});
}
function renderFact(st,it){
  var f=S.facts[it.id];if(!f){nextItem();return}
  var h=head('b1',(cur.i+1)+' / '+cur.items.length)+'<div class="row"><span class="area c">'+esc(f.topic)+'</span> <span class="small">'+t('review')+'</span></div><div class="concept">'+esc(f.q)+'</div><p class="small">'+t('factQ')+'</p><textarea id="rt" aria-label="'+esc(f.q)+'">'+esc(cur.text)+'</textarea>';
  if(!cur.revealed){h+='<div class="row"><button class="btn primary" id="rv">'+t('reveal')+'</button></div>';st.innerHTML=h;$('rt').oninput=function(e){cur.text=e.target.value};$('rv').onclick=function(){cur.text=$('rt').value;cur.revealed=true;render()};return}
  h+='<div class="def"><p>'+esc(f.a)+'</p></div><div class="row"><button class="btn rate-0" data-r="0">'+t('rate0')+'</button><button class="btn rate-1" data-r="1">'+t('rate1')+'</button><button class="btn rate-2" data-r="2">'+t('rate2')+'</button></div>';
  st.innerHTML=h;st.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){grade(it.id,+b.getAttribute('data-r'));nextItem()}});
}
function topicName(id){var r=TOPICS.filter(function(x){return x[0]===id})[0];return r?(L()==='en'?r[2]:r[1]):id}
function makeLesson(){
  if(!sample)return;var id=cur.topic,name=topicName(id);cur.lesson={wait:true};render();
  var lang=L()==='en'?'English':'Spanish (Colombian, neutral)';
  sample.json('Write a short daily-learning lesson for a curious adult (math graduate, data engineer in Colombia) who wants to be able to talk knowledgeably about many subjects. Topic: "'+name+'". Write in '+lang+'. Be accurate and use mainstream, well-established knowledge; where a topic is politically, religiously or morally contested, describe the main positions fairly without taking sides. Return ONLY JSON: {"title": string, "lesson": string (160-220 words, plain text, 2-3 short paragraphs, concrete facts, names, dates and numbers where useful), "perspectives": null or [string, string] (only for contested topics: two fair one-sentence views), "talk": string (one natural sentence he could say in a conversation), "facts": [{"q": string, "a": string}, ...] (exactly 3 short recall questions with 1-2 sentence answers)}',{modelTier:'default',cache:false})
  .then(function(j){if(!j||!j.lesson||!j.facts)throw 0;cur.lesson={topic:id,title:j.title||name,lesson:j.lesson,perspectives:j.perspectives||null,talk:j.talk||'',facts:j.facts.slice(0,3)};render()})
  .catch(function(){cur.lesson={err:true};render()});
}
function saveLesson(){
  var ls=cur.lesson,n=dayNum(today()),lid=today()+'-'+ls.topic;
  ls.facts.forEach(function(f,i){var fid='f:'+lid+':'+i;S.facts[fid]={q:f.q,a:f.a,topic:ls.title};S.cards[fid]={box:1,due:n+1,reps:0,lapses:0}});
  S.lessons.unshift({id:lid,date:today(),topic:ls.topic,title:ls.title,lesson:ls.lesson,perspectives:ls.perspectives,talk:ls.talk,lang:L()});
  if(ls.topic===TOPICS[S.ti%TOPICS.length][0])S.ti++;save();
}
function finishSession(){if(S.days.indexOf(today())<0)S.days.push(today());save();cur.block=6;render();window.scrollTo(0,0)}
function renderDiscover(st){
  var h=head('b4')+'<p class="small">'+t('discQ')+'</p>';
  if(!sample){st.innerHTML=h+'<p class="note small">'+t('noSample')+'</p><div class="row"><button class="btn primary" id="fin">'+t('finish')+'</button></div>';$('fin').onclick=finishSession;return}
  var ls=cur.lesson;
  if(!ls){h+='<div class="concept">'+esc(topicName(cur.topic))+'</div><div class="row"><button class="btn primary" id="mk">'+t('b4')+'</button><button class="btn" id="fin">'+t('skip')+'</button></div><p class="small">'+t('pick')+'</p><div class="topics">'+

var PTOP=[['Análisis real','Real analysis'],['Álgebra lineal','Linear algebra'],['Álgebra abstracta','Abstract algebra'],['Teoría de números','Number theory'],['Cálculo','Calculus'],['Combinatoria','Combinatorics'],['Probabilidad','Probability'],['Ecuaciones diferenciales','Differential equations'],['Topología básica','Basic topology'],['Geometría','Geometry']];
var PSTATIC=[
 ['Teoría de números','Number theory','Demuestra que √2 es irracional.','Prove that √2 is irrational.','Supón que √2 = p/q con la fracción reducida.','Assume √2 = p/q in lowest terms.','Si √2 = p/q irreducible, entonces p² = 2q², así que p² es par y p es par: p = 2k. Entonces 4k² = 2q², o sea q² = 2k², y q también es par. Ambos pares contradice que la fracción era irreducible.','If √2 = p/q in lowest terms, then p² = 2q², so p² is even and p is even: p = 2k. Then 4k² = 2q², so q² = 2k² and q is even too. Both even contradicts lowest terms.'],
 ['Combinatoria','Combinatorics','Demuestra que 1 + 3 + 5 + … + (2n − 1) = n².','Prove that 1 + 3 + 5 + … + (2n − 1) = n².','Inducción, o imagina cuadrados que crecen.','Induction, or picture growing squares.','Base: n = 1 da 1 = 1². Paso: si la suma hasta 2n − 1 es n², al sumar 2n + 1 queda n² + 2n + 1 = (n + 1)².','Base: n = 1 gives 1 = 1². Step: if the sum up to 2n − 1 is n², adding 2n + 1 gives n² + 2n + 1 = (n + 1)².'],
 ['Teoría de números','Number theory','Demuestra que existen infinitos números primos.','Prove there are infinitely many primes.','Supón que hay una lista finita y construye un número nuevo.','Assume a finite list and build a new number.','Si p₁,…,pₖ fueran todos los primos, N = p₁·…·pₖ + 1 deja residuo 1 al dividir por cada uno, así que ninguno lo divide. Pero N > 1 tiene algún factor primo, que no está en la lista. Contradicción.','If p₁,…,pₖ were all the primes, N = p₁·…·pₖ + 1 leaves remainder 1 when divided by each, so none divides it. But N > 1 has some prime factor not on the list. Contradiction.'],
 ['Cálculo','Calculus','Calcula la derivada de f(x) = xˣ para x > 0.','Find the derivative of f(x) = xˣ for x > 0.','Escribe xˣ = e^(x ln x).','Write xˣ = e^(x ln x).','f(x) = e^(x ln x), así que f′(x) = e^(x ln x)·(ln x + 1) = xˣ(ln x + 1).','f(x) = e^(x ln x), so f′(x) = e^(x ln x)·(ln x + 1) = xˣ(ln x + 1).'],
 ['Cálculo','Calculus','Calcula ∫ x eˣ dx.','Compute ∫ x eˣ dx.','Integración por partes con u = x.','Integration by parts with u = x.','u = x, dv = eˣ dx: ∫ x eˣ dx = x eˣ − ∫ eˣ dx = (x − 1)eˣ + C.','u = x, dv = eˣ dx: ∫ x eˣ dx = x eˣ − ∫ eˣ dx = (x − 1)eˣ + C.'],
 ['Álgebra lineal','Linear algebra','Encuentra los valores y vectores propios de A = [[2, 1], [1, 2]].','Find the eigenvalues and eigenvectors of A = [[2, 1], [1, 2]].','Resuelve det(A − λI) = 0.','Solve det(A − λI) = 0.','(2 − λ)² − 1 = 0 da λ = 3 y λ = 1. Para λ = 3: (1, 1). Para λ = 1: (1, −1).','(2 − λ)² − 1 = 0 gives λ = 3 and λ = 1. For λ = 3: (1, 1). For λ = 1: (1, −1).'],
 ['Combinatoria','Combinatorics','¿Cuántos subconjuntos tiene un conjunto de n elementos? Justifícalo.','How many subsets does a set with n elements have? Justify it.','Cada elemento toma una decisión.','Each element makes a choice.','Cada elemento está o no está en el subconjunto: 2 opciones independientes por elemento, así que hay 2ⁿ subconjuntos.','Each element is either in or out: 2 independent choices per element, so there are 2ⁿ subsets.'],
 ['Teoría de números','Number theory','Calcula mcd(252, 198) con el algoritmo de Euclides.','Compute gcd(252, 198) with the Euclidean algorithm.','Divide y quédate con el residuo.','Divide and keep the remainder.','252 = 1·198 + 54; 198 = 3·54 + 36; 54 = 1·36 + 18; 36 = 2·18. El mcd es 18.','252 = 1·198 + 54; 198 = 3·54 + 36; 54 = 1·36 + 18; 36 = 2·18. The gcd is 18.'],
 ['Teoría de números','Number theory','Demuestra que n³ − n es divisible por 6 para todo entero n.','Prove that n³ − n is divisible by 6 for every integer n.','Factoriza.','Factor it.','n³ − n = (n − 1)n(n + 1) es el producto de tres enteros consecutivos: uno es múltiplo de 3 y al menos uno es par. Por eso es divisible por 6.','n³ − n = (n − 1)n(n + 1) is a product of three consecutive integers: one is a multiple of 3 and at least one is even, so it is divisible by 6.'],
 ['Análisis real','Real analysis','Calcula lím x→0 de (1 − cos x) / x².','Compute lim x→0 of (1 − cos x) / x².','Multiplica arriba y abajo por (1 + cos x).','Multiply top and bottom by (1 + cos x).','(1 − cos x)/x² = sin²x / (x²(1 + cos x)) = (sin x / x)² · 1/(1 + cos x) → 1 · 1/2 = 1/2.','(1 − cos x)/x² = sin²x / (x²(1 + cos x)) = (sin x / x)² · 1/(1 + cos x) → 1 · 1/2 = 1/2.'],
 ['Probabilidad','Probability','Lanzas dos dados. ¿Cuál es la probabilidad de que la suma sea 7?','You roll two dice. What is the probability the sum is 7?','Cuenta pares ordenados.','Count ordered pairs.','Hay 36 resultados igual de probables y 6 suman 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1). Probabilidad 6/36 = 1/6.','There are 36 equally likely outcomes and 6 sum to 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1). Probability 6/36 = 1/6.'],
 ['Álgebra abstracta','Abstract algebra','Demuestra que todo grupo de orden primo p es cíclico.','Prove that every group of prime order p is cyclic.','Teorema de Lagrange.','Lagrange\'s theorem.','Toma g ≠ e. El subgrupo ⟨g⟩ tiene orden que divide a p (Lagrange) y es mayor que 1, así que es p. Entonces ⟨g⟩ es todo el grupo.','Take g ≠ e. The subgroup ⟨g⟩ has order dividing p (Lagrange) and greater than 1, so it is p. Hence ⟨g⟩ is the whole group.']

function pureState(){if(!S.pure)S.pure={today:null,hist:[],si:0,ti:0};var p=S.pure;if(p.step==null){p.step=0;if(p.today&&p.today.step==null)p.today=null}return p}
var pureUI={sol:'',fb:null,showHint:false,showSol:false,wait:false,err:false};
function staticProblem(){var p=pureState();var r=PSTATIC[p.si%PSTATIC.length];p.si++;
  return {date:today(),area:{es:r[0],en:r[1]},q:{es:r[2],en:r[3]},hint:{es:r[4],en:r[5]},sol:{es:r[6],en:r[7]}}}
function newPure(){
  var p=pureState();
  if(!sample){p.today=staticProblem();save();renderPure();return}
  var step=Math.min(p.step,SYL.length-1),top=SYL[step];pureUI.wait=true;pureUI.err=false;renderPure();
  var seen=(p.hist||[]).filter(function(h){return h.step===step}).length;
  sample.json('Create a 5-minute math refresher card on "'+top[1]+'" (step '+(step+1)+' of a '+SYL.length+'-step course that rebuilds math from the basics). The learner studied a math degree years ago but has not practiced in a long time and wants to recover step by step, so explain as a friendly tutor would to someone rusty: no assumed recent practice, define any symbol you use, and keep it concrete. '+(seen?'He has already seen '+seen+' card(s) on this step, so cover a different aspect or example of the same topic. ':'')+'Part 1, "lesson": 90-140 words: the core idea in plain words, the key rule or formula, and ONE short worked example with numbers. Part 2, "q": one quick question on the same idea, similar to the worked example, answerable in 1-3 minutes with a couple of lines; never a long proof. Use plain text with Unicode math symbols (², √, ∫, ≤, ∈, →), never LaTeX. Return ONLY JSON: {"es":{"area":string,"lesson":string,"q":string,"hint":string,"sol":string},"en":{same keys}} with Spanish under "es" and English under "en"; hint is one nudge, sol is a short correct answer with its reasoning.',{modelTier:'default',cache:false})
  .then(function(j){if(!j||!j.es||!j.en||!j.es.q)throw 0;p.today={date:today(),step:step,area:{es:top[0],en:top[1]},lesson:j.es.lesson?{es:j.es.lesson,en:j.en.lesson}:null,q:{es:j.es.q,en:j.en.q},hint:{es:j.es.hint,en:j.en.hint},sol:{es:j.es.sol,en:j.en.sol}};pureUI.wait=false;save();renderPure()})
  .catch(function(){pureUI.wait=false;p.today=staticProblem();save();renderPure()});
}
function renderPure(){
  var p=pureState(),el=$('pure'),tp=p.today;
  if(pureUI.wait){el.innerHTML='<div class="card"><p class="fb wait">'+t('pGen')+'</p></div>';return}
  if(!tp||tp.date!==today()){
    el.innerHTML='<div class="card"><h2>'+t('pTitle')+'</h2><p class="small">'+t('pHelp')+'</p><p><b>'+t('pNext')+'</b> '+esc(SYL[p.step][L()==='en'?1:0])+' <span class="small">('+t('pStep',{n:p.step+1,m:SYL.length})+')</span></p><div class="row"><button class="btn primary" id="pnew">'+t('pToday')+'</button></div></div>'+pureSyl()+pureHist();
    $('pnew').onclick=function(){pureUI={sol:'',fb:null,showHint:false,showSol:false,wait:false};newPure()};return}
  var h='<div class="card"><div class="row"><span class="area m">'+esc(tp.area[L()])+'</span> <span class="small">'+(tp.step!=null?t('pStep',{n:tp.step+1,m:SYL.length})+' · ':'')+t('pMin')+'</span></div>'+(tp.lesson?'<div class="def"><p class="lesson">'+esc(tp.lesson[L()])+'</p></div>':'')+'<p><b>'+t('pQ')+'</b> '+esc(tp.q[L()])+'</p>'+
    '<textarea id="psol" class="mono" placeholder="'+esc(t('pPh'))+'" aria-label="'+esc(t('pPh'))+'">'+esc(pureUI.sol)+'</textarea>'+
    (pureUI.showHint?'<div class="def"><p><b>'+t('pHint')+':</b> '+esc(tp.hint[L()])+'</p></div>':'')+
    (pureUI.fb?'<div class="fb'+(pureUI.fb.wait?' wait':'')+'" id="pfb">'+esc(pureUI.fb.text)+'</div>':'')+
    (pureUI.showSol?'<div class="def"><p><b>'+t('pSol')+':</b></p><p class="lesson">'+esc(tp.sol[L()])+'</p></div>':'')+
    '<div class="row">'+(!pureUI.showHint?'<button class="btn" id="phint">'+t('pHint')+'</button>':'')+
    (sample?'<button class="btn" id="pcheck"'+(pureUI.fb&&pureUI.fb.wait?' disabled':'')+'>'+t('pCheck')+'</button>':'')+
    (!pureUI.showSol?'<button class="btn primary" id="pshow">'+t('pSol')+'</button>':(tp.step==null?'<button class="btn" id="pnew2">'+t('pAnother')+'</button>':''))+'</div>'+
    (pureUI.showSol&&tp.step!=null?'<div class="row"><button class="btn rate-2" id="padv">'+t('pGot')+'</button><button class="btn rate-1" id="prep">'+t('pRepeat')+'</button></div>':'')+'</div>'+pureSyl()+pureHist();
  el.innerHTML=h;var ta=$('psol');ta.oninput=function(e){pureUI.sol=e.target.value};
  if($('phint'))$('phint').onclick=function(){pureUI.showHint=true;renderPure()};
  if($('pshow'))$('pshow').onclick=function(){pureUI.showSol=true;var hs=p.hist;if(!hs.length||hs[0].q.es!==tp.q.es){hs.unshift({date:tp.date,step:tp.step,area:tp.area,q:tp.q,mine:pureUI.sol});p.hist=hs.slice(0,40);save()}renderPure()};
  if($('pnew2'))$('pnew2').onclick=function(){p.today=null;pureUI={sol:'',fb:null,showHint:false,showSol:false};newPure()};
  if($('padv'))$('padv').onclick=function(){if(p.step===tp.step)p.step=Math.min(SYL.length-1,p.step+1);p.today=null;save();pureUI={sol:'',fb:null,showHint:false,showSol:false};renderPure();window.scrollTo(0,0)};
  if($('prep'))$('prep').onclick=function(){p.today=null;save();pureUI={sol:'',fb:null,showHint:false,showSol:false};newPure()};
  if($('pcheck'))$('pcheck').onclick=function(){pureUI.sol=ta.value;if(pureUI.sol.trim().length<10)return;pureUI.fb={wait:true,text:t('fbWait')};renderPure();
    sample('You are a rigorous but encouraging math professor. Quick question: '+tp.q.en+'\nReference solution: '+tp.sol.en+'\nStudent attempt:\n"""'+pureUI.sol+'"""\nIn 2-4 short sentences: say whether the answer is correct, point to the first gap or error precisely, and say what would fix it. Do not just paste the reference solution. Plain text with Unicode math, no LaTeX. '+langLine(),{cache:false,modelTier:'default',onText:function(u){var o=$('pfb');pureUI.fb={wait:false,text:u.text};if(o){o.textContent=u.text;o.className='fb'}}})
    .then(function(r){pureUI.fb={wait:false,text:r.text};renderPure()}).catch(function(){pureUI.fb={wait:false,text:t('fbErr')};renderPure()})};
}
function pureSyl(){var p=pureState();return '<details class="card"><summary>'+t('pSyl')+'</summary><ol class="syl">'+SYL.map(function(r,i){return '<li class="'+(i<p.step?'done':i===p.step?'now':'')+'"><button class="linkbtn" data-step="'+i+'">'+esc(r[L()==='en'?1:0])+'</button></li>'}).join('')+'</ol><p class="small">'+t('pJump')+'</p></details>'}
document.addEventListener('click',function(e){var b=e.target.closest('[data-step]');if(!b)return;var p=pureState();p.step=+b.getAttribute('data-step');p.today=null;save();pureUI={sol:'',fb:null,showHint:false,showSol:false};renderPure();window.scrollTo(0,0)});
function pureHist(){var hs=pureState().hist;if(!hs.length)return '';
  return '<h3>'+t('pHist')+'</h3>'+hs.slice(0,15).map(function(x){return '<details class="entry"><summary><span class="meta">'+esc(x.date)+' · '+esc(x.area[L()])+'</span></summary><div class="lesson">'+esc(x.q[L()])+'</div>'+(x.mine?'<div class="fb mono">'+esc(x.mine)+'</div>':'')+'</details>'}).join('')}

/* ---------------- library + journal + settings ---------------- */
function renderLib(){
  var h='';Object.keys(AREAS).forEach(function(a){
    h+='<div class="libgroup"><span class="area '+a+'" style="align-self:flex-start">'+esc(AREAS[a][L()])+'</span>';
    C.filter(function(r){return r[1]===a}).forEach(function(r){var c=CONCEPTS[r[0]],s=S.cards[r[0]],box=s?s.box:0,dots='';
      for(var i=1;i<=5;i++)dots+='<i class="'+(box>=i?'on':'')+'"></i>';
      h+='<button class="libitem" data-id="'+c.id+'"><span class="nm">'+esc(c.n[L()])+'</span><span class="dots" aria-label="'+box+'/5">'+dots+'</span><span class="dd" hidden>'+esc(c.d[L()])+'<br><i>'+esc(c.x[L()])+'</i></span></button>'});
    h+='</div>'});
  $('lib').innerHTML=h;
  $('lib').querySelectorAll('.libitem').forEach(function(b){b.onclick=function(){var d=b.querySelector('.dd');d.hidden=!d.hidden}});
}
function renderJournal(){
  if(!S.journal.length){$('journal').innerHTML='<p class="empty">'+t('noJournal')+'</p>';return}
  $('journal').innerHTML=S.journal.map(function(j){return '<div class="entry"><span class="meta">'+esc(j.date)+' · '+esc(cn(j.a))+' + '+esc(cn(j.b))+'</span><div>'+esc(j.text)+'</div>'+(j.fb?'<div class="fb">'+esc(j.fb)+'</div>':'')+'</div>'}).join('');
}
function renderSet(){
  $('npd').innerHTML=[1,2,3,4].map(function(n){return '<button class="btn'+(S.npd===n?' primary':'')+'" data-n="'+n+'">'+n+'</button>'}).join('');
  $('npd').querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){S.npd=+b.getAttribute('data-n');save();renderSet()}});
}
$('bCopy').onclick=function(){var s=JSON.stringify(S);$('iBackup').value=s;
  try{navigator.clipboard.writeText(s).then(function(){$('bkMsg').textContent=t('copied')},function(){$('iBackup').select();$('bkMsg').textContent=t('selectIt')})}catch(e){$('iBackup').select();$('bkMsg').textContent=t('selectIt')}};
$('bRestore').onclick=function(){try{var o=JSON.parse($('iBackup').value);if(!o.cards)throw 0;S=Object.assign(blank(),o);save();cur=null;applyLang();$('bkMsg').textContent=t('restored')}catch(e){$('bkMsg').textContent=t('badBackup')}};
var armed=false;$('bReset').onclick=function(){if(!armed){armed=true;$('bReset').textContent=t('resetArm');setTimeout(function(){armed=false;$('bReset').textContent=t('reset')},4000);return}
  var lang=S.lang;S=blank();S.lang=lang;save();cur=null;armed=false;applyLang();$('bkMsg').textContent=t('wiped')};

/* ---------------- tabs + language ---------------- */
function openTab(id){if(id!=='p-today'&&cur&&cur.calc&&cur.calc.phase==='run'){stopCalc();cur.calc.phase='intro'}document.querySelectorAll('.tab').forEach(function(x){var on=x.dataset.p===id;x.setAttribute('aria-selected',on);$(x.dataset.p).hidden=!on});
  if(id==='p-lib')renderLib();if(id==='p-know')renderKnow();if(id==='p-pure'){renderPure();$('calcProg').innerHTML='<h3>'+t('bCalc')+'</h3><div class="row"><button class="btn primary" id="calcGo2">'+t('calcOnly')+'</button></div>'+calcChart()+calcLevels();$('calcGo2').onclick=startCalcOnly}if(id==='p-journal')renderJournal();if(id==='p-set')renderSet()}
document.querySelectorAll('.tab').forEach(function(x){x.onclick=function(){openTab(x.dataset.p)}});
function applyLang(){
  document.documentElement.lang=L();
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.getAttribute('data-t'))});
  $('lEs').setAttribute('aria-pressed',L()==='es');$('lEn').setAttribute('aria-pressed',L()==='en');
  render();var open=document.querySelector('.tab[aria-selected="true"]');if(open)openTab(open.dataset.p);
}
$('lEs').onclick=function(){S.lang='es';save();applyLang()};
$('lEn').onclick=function(){S.lang='en';save();applyLang()};
applyLang();
startSync();
})();
</script>
