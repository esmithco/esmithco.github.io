global:{es:{t:'Globalización y comercio internacional',l:'Globalización es la conexión creciente de economías, culturas y personas: comercio, inversión, internet, viajes. El comercio se basa en la ventaja comparativa (Ricardo, 1817): a cada país le conviene especializarse en lo que produce con menor costo relativo e intercambiar.\n\nDesde 1990, el comercio ayudó a sacar a cientos de millones de personas de la pobreza extrema, sobre todo en Asia. Pero también trajo pérdidas concentradas: fábricas que cierran en ciertas regiones y dependencia de cadenas de suministro lejanas, como se vio en la pandemia.',talk:'El comercio hace crecer la torta en total, pero las pérdidas caen en lugares concretos, y eso explica buena parte de la política actual.',p:['A favor: el comercio abarata productos, difunde tecnología y ha reducido la pobreza mundial.','En contra: concentra pérdidas en trabajadores y regiones, y hace a los países dependientes de otros.'],f:[['¿Quién formuló la ventaja comparativa?','David Ricardo, en 1817.'],['¿Qué región redujo más la pobreza con el comercio?','Asia, sobre todo China.'],['¿Qué fragilidad mostró la pandemia?','La dependencia de cadenas de suministro lejanas.']]},
 en:{t:'Globalization and international trade',l:'Globalization is the growing connection of economies, cultures and people: trade, investment, the internet, travel. Trade rests on comparative advantage (Ricardo, 1817): each country gains by specializing in what it produces at the lowest relative cost and trading.\n\nSince 1990, trade has helped lift hundreds of millions out of extreme poverty, especially in Asia. But it also brought concentrated losses: factories closing in certain regions and dependence on distant supply chains, as the pandemic showed.',talk:'Trade grows the pie overall, but the losses land in specific places, which explains a lot of today\'s politics.',p:['For: trade makes goods cheaper, spreads technology and has reduced world poverty.','Against: it concentrates losses on certain workers and regions and makes countries dependent on others.'],f:[['Who formulated comparative advantage?','David Ricardo, in 1817.'],['Which region cut poverty most through trade?','Asia, especially China.'],['What weakness did the pandemic reveal?','Dependence on distant supply chains.']]}},
art:{es:{t:'El Renacimiento',l:'Entre los siglos XIV y XVI, primero en Florencia, Europa volvió a mirar a la Grecia y Roma clásicas y puso al ser humano en el centro (humanismo). Familias ricas como los Médici financiaban artistas.\n\nEl arte cambió: la perspectiva lineal, formalizada por Brunelleschi, dio profundidad real a las pinturas; se estudió la anatomía para pintar cuerpos creíbles. Leonardo (La Gioconda), Miguel Ángel (la Capilla Sixtina, el David) y Rafael son sus grandes nombres. La imprenta de Gutenberg (hacia 1450) multiplicó la circulación de ideas.',talk:'El gran truco del Renacimiento fue la perspectiva: de repente las pinturas tenían profundidad como una ventana.',p:null,f:[['¿En qué ciudad empezó el Renacimiento?','Florencia.'],['¿Qué técnica dio profundidad a la pintura?','La perspectiva lineal (Brunelleschi).'],['¿Qué invento multiplicó la circulación de ideas?','La imprenta de Gutenberg, hacia 1450.']]},
 en:{t:'The Renaissance',l:'Between the 14th and 16th centuries, starting in Florence, Europe looked back to classical Greece and Rome and put human beings at the center (humanism). Rich families like the Medici funded artists.\n\nArt changed: linear perspective, formalized by Brunelleschi, gave paintings real depth; artists studied anatomy to paint believable bodies. Leonardo (the Mona Lisa), Michelangelo (the Sistine Chapel, David) and Raphael are its great names. Gutenberg\'s printing press (around 1450) multiplied the spread of ideas.',talk:'The Renaissance\'s big trick was perspective: suddenly paintings had depth, like a window.',p:null,f:[['In which city did the Renaissance begin?','Florence.'],['Which technique gave paintings depth?','Linear perspective (Brunelleschi).'],['Which invention multiplied the spread of ideas?','Gutenberg\'s printing press, around 1450.']]}},
music:{es:{t:'Por qué ciertas notas suenan bien juntas',l:'Una nota es una vibración con cierta frecuencia. Pitágoras ya notó que las cuerdas cuyas longitudes guardan proporciones simples suenan bien juntas: 2:1 es la octava (la misma nota más aguda) y 3:2 es la quinta.\n\nCuando dos frecuencias tienen una proporción simple, sus ondas coinciden a menudo y el cerebro las percibe como estables (consonancia); proporciones complejas producen batidos que suenan tensos (disonancia). La escala occidental de 12 notas reparte la octava en partes iguales, un pequeño compromiso que permite tocar en cualquier tonalidad. La cultura también influye mucho en lo que suena "bonito".',talk:'Pitágoras descubrió que las notas que suenan bien juntas tienen frecuencias en proporciones simples, como 2 a 1 o 3 a 2.',p:null,f:[['¿Qué proporción de frecuencias es la octava?','2:1.'],['¿Y la quinta?','3:2.'],['¿En cuántas notas divide la octava la escala occidental?','En 12.']]},
 en:{t:'Why some notes sound good together',l:'A note is a vibration at a certain frequency. Pythagoras noticed that strings whose lengths form simple ratios sound good together: 2:1 is the octave (the same note, higher) and 3:2 is the fifth.\n\nWhen two frequencies form a simple ratio, their waves line up often and the brain hears them as stable (consonance); complex ratios create beats that sound tense (dissonance). The Western 12-note scale splits the octave into equal steps, a small compromise that lets you play in any key. Culture also shapes a lot of what sounds "nice".',talk:'Pythagoras found that notes that sound good together have frequencies in simple ratios, like 2 to 1 or 3 to 2.',p:null,f:[['What frequency ratio is an octave?','2:1.'],['And a fifth?','3:2.'],['Into how many notes does the Western scale split the octave?','12.']]}},
tech:{es:{t:'Cómo funciona internet',l:'Internet es una red de redes. Cuando abres una página, tu equipo pregunta primero al DNS, la "guía telefónica" que traduce el nombre (como google.com) a una dirección IP.\n\nLuego tu petición se parte en paquetes pequeños que viajan por routers, cada uno por la ruta disponible, a menudo por cables submarinos de fibra óptica que llevan cerca del 99% del tráfico entre continentes. El protocolo TCP/IP se encarga de que lleguen todos y en orden. La web (páginas con enlaces) es solo un servicio encima de internet; la inventó Tim Berners-Lee en 1989.',talk:'Casi todo internet entre continentes viaja por cables en el fondo del mar, no por satélites.',p:null,f:[['¿Qué hace el DNS?','Traduce nombres de dominio a direcciones IP.'],['¿Por dónde viaja casi todo el tráfico entre continentes?','Por cables submarinos de fibra óptica.'],['¿Quién inventó la web y cuándo?','Tim Berners-Lee, en 1989.']]},
 en:{t:'How the internet works',l:'The internet is a network of networks. When you open a page, your device first asks DNS, the "phone book" that turns a name (like google.com) into an IP address.\n\nThen your request is split into small packets that travel through routers, each along whatever route is available, often through undersea fiber-optic cables that carry about 99% of traffic between continents. The TCP/IP protocol makes sure they all arrive, in order. The web (pages with links) is just one service running on the internet; Tim Berners-Lee invented it in 1989.',talk:'Almost all internet traffic between continents travels through cables on the ocean floor, not satellites.',p:null,f:[['What does DNS do?','It turns domain names into IP addresses.'],['How does most traffic between continents travel?','Through undersea fiber-optic cables.'],['Who invented the web, and when?','Tim Berners-Lee, in 1989.']]}},
ai:{es:{t:'Qué es realmente la inteligencia artificial',l:'La IA actual casi nunca sigue reglas escritas a mano: aprende patrones a partir de muchísimos ejemplos (aprendizaje automático). Las redes neuronales ajustan millones o miles de millones de números hasta que sus respuestas se parecen a los datos.\n\nLos modelos de lenguaje, como los chatbots, se entrenan para predecir la siguiente palabra en enormes cantidades de texto, y de eso surgen habilidades sorprendentes. Pueden equivocarse con total seguridad ("alucinar"), por eso conviene verificar datos importantes. El término "inteligencia artificial" se acuñó en 1956.',talk:'Un modelo de lenguaje aprende prediciendo la siguiente palabra, y de algo tan simple salen habilidades sorprendentes.',p:['Unos ven la IA sobre todo como una herramienta que aumentará la productividad y el conocimiento.','Otros advierten riesgos serios: empleos, desinformación y sistemas cada vez más difíciles de controlar.'],f:[['¿Cómo aprende la IA moderna?','A partir de muchísimos ejemplos, ajustando números (aprendizaje automático).'],['¿Para qué se entrena un modelo de lenguaje?','Para predecir la siguiente palabra en textos.'],['¿Cuándo se acuñó el término "inteligencia artificial"?','En 1956.']]},
 en:{t:'What artificial intelligence really is',l:'Today\'s AI rarely follows hand-written rules: it learns patterns from huge numbers of examples (machine learning). Neural networks tune millions or billions of numbers until their outputs match the data.\n\nLanguage models, like chatbots, are trained to predict the next word across vast amounts of text, and surprising abilities emerge from that. They can be confidently wrong ("hallucinate"), so it\'s wise to check important facts. The term "artificial intelligence" was coined in 1956.',talk:'A language model learns by predicting the next word, and surprising abilities come out of something that simple.',p:['Some see AI mainly as a tool that will boost productivity and knowledge.','Others warn of serious risks: jobs, misinformation and systems that grow harder to control.'],f:[['How does modern AI learn?','From huge numbers of examples, by tuning numbers (machine learning).'],['What is a language model trained to do?','Predict the next word in text.'],['When was the term "artificial intelligence" coined?','In 1956.']]}},
climate:{es:{t:'Cambio climático: la física del efecto invernadero',l:'El Sol calienta la Tierra y la Tierra devuelve calor al espacio como radiación infrarroja. Gases como el CO₂, el metano y el vapor de agua atrapan parte de ese calor; ya en 1859 John Tyndall lo midió en laboratorio.\n\nDesde la Revolución Industrial, quemar carbón, petróleo y gas subió el CO₂ de unas 280 a más de 420 partes por millón, y la temperatura media ha subido cerca de 1,2 °C. Las consecuencias: más olas de calor, cambios en lluvias, glaciares que se derriten (Colombia ha perdido la mayoría de los suyos) y subida del nivel del mar.',talk:'Que el CO₂ atrapa calor se mide en laboratorio desde 1859; lo nuevo es cuánto CO₂ hemos agregado.',p:null,f:[['¿Quién midió en 1859 que ciertos gases atrapan calor?','John Tyndall.'],['¿Cuánto CO₂ hay hoy frente a antes de la industria?','Más de 420 ppm frente a unas 280.'],['¿Cuánto ha subido la temperatura media?','Cerca de 1,2 °C.']]},
 en:{t:'Climate change: the physics of the greenhouse effect',l:'The Sun warms Earth and Earth sends heat back to space as infrared radiation. Gases like CO₂, methane and water vapor trap part of that heat; John Tyndall measured this in a lab as early as 1859.\n\nSince the Industrial Revolution, burning coal, oil and gas has pushed CO₂ from about 280 to over 420 parts per million, and average temperature has risen about 1.2 °C. The consequences: more heat waves, shifting rainfall, melting glaciers (Colombia has lost most of its own) and rising seas.',talk:'That CO₂ traps heat has been measured in labs since 1859; what\'s new is how much CO₂ we\'ve added.',p:null,f:[['Who measured in 1859 that certain gases trap heat?','John Tyndall.'],['How much CO₂ is there now vs. before industry?','Over 420 ppm vs. about 280.'],['How much has average temperature risen?','About 1.2 °C.']]}},
quantum:{es:{t:'Física cuántica sin fórmulas',l:'A escala de átomos, la naturaleza no funciona como en la vida diaria. La energía viene en paquetes ("cuantos", Planck, 1900). La luz y los electrones se comportan como partículas o como ondas según cómo los midas.\n\nUna partícula puede estar en una superposición de estados hasta que se mide, y solo podemos predecir probabilidades. El principio de incertidumbre de Heisenberg dice que no puedes conocer a la vez con total precisión la posición y la velocidad de una partícula. Por raro que suene, es la teoría más precisa de la historia: gracias a ella existen los transistores, los láseres y la resonancia magnética.',talk:'Lo más raro de la física cuántica es que solo predice probabilidades, y aun así es la teoría más precisa que tenemos.',p:null,f:[['¿Quién propuso que la energía viene en paquetes?','Max Planck, en 1900.'],['¿Qué dice el principio de incertidumbre?','Que no se pueden conocer a la vez con total precisión la posición y la velocidad.'],['Nombra un invento que depende de la física cuántica.','El transistor, el láser o la resonancia magnética.']]},
 en:{t:'Quantum physics without equations',l:'At the scale of atoms, nature doesn\'t behave like everyday life. Energy comes in packets ("quanta", Planck, 1900). Light and electrons act like particles or like waves depending on how you measure them.\n\nA particle can be in a superposition of states until it\'s measured, and we can only predict probabilities. Heisenberg\'s uncertainty principle says you can\'t know a particle\'s position and speed both with perfect precision. Strange as it sounds, it\'s the most accurate theory in history: transistors, lasers and MRI scanners exist because of it.',talk:'The strangest thing about quantum physics is that it only predicts probabilities, and yet it\'s the most accurate theory we have.',p:null,f:[['Who proposed that energy comes in packets?','Max Planck, in 1900.'],['What does the uncertainty principle say?','You can\'t know position and speed both with perfect precision.'],['Name an invention that depends on quantum physics.','The transistor, the laser or MRI.']]}},
lang:{es:{t:'De dónde viene el español',l:'El español es latín que fue cambiando. Cuando Roma conquistó la península ibérica (desde el 218 a. C.), el latín hablado por soldados y colonos se mezcló con las lenguas locales y, con los siglos, se volvió castellano.\n\nLos árabes, presentes casi 800 años (711-1492), dejaron unas 4.000 palabras: almohada, azúcar, ojalá, aceite. En 1492 Nebrija publicó la primera gramática del castellano, y ese mismo año empezó su llegada a América, donde tomó palabras indígenas como chocolate, tomate o canoa. Hoy lo hablan unos 500 millones de nativos.',talk:'Ojalá viene del árabe y quiere decir algo como "si Dios quiere".',p:null,f:[['¿De qué lengua viene el español?','Del latín.'],['Da un ejemplo de palabra de origen árabe.','Almohada, azúcar, ojalá, aceite.'],['¿Quién publicó la primera gramática del castellano y cuándo?','Antonio de Nebrija, en 1492.']]},
 en:{t:'Where Spanish comes from',l:'Spanish is Latin that kept changing. When Rome conquered the Iberian Peninsula (from 218 BC), the Latin spoken by soldiers and settlers blended with local languages and, over centuries, became Castilian.\n\nThe Moors, present for almost 800 years (711-1492), left some 4,000 words: almohada (pillow), azúcar (sugar), ojalá (hopefully), aceite (oil). In 1492 Nebrija published the first Castilian grammar, and that same year Spanish began reaching the Americas, where it took Indigenous words like chocolate, tomato and canoe. Today about 500 million people speak it natively.',talk:'"Ojalá" comes from Arabic and means something like "God willing."',p:null,f:[['Which language does Spanish come from?','Latin.'],['Give an example of a Spanish word from Arabic.','Almohada, azúcar, ojalá, aceite.'],['Who published the first Castilian grammar, and when?','Antonio de Nebrija, in 1492.']]}},
food:{es:{t:'La historia del café en Colombia',l:'El café es originario de Etiopía y pasó por Yemen antes de llegar a Europa y América. A Colombia llegó en el siglo XVIII, probablemente con jesuitas; según la tradición, el padre Francisco Romero ponía como penitencia sembrar matas de café.\n\nEn el siglo XIX y comienzos del XX se volvió el motor de la economía y de la colonización antioqueña en el Eje Cafetero. En 1927 nació la Federación Nacional de Cafeteros, y en 1958 el personaje Juan Valdez. Colombia es el mayor productor mundial de café arábigo suave lavado; el Paisaje Cultural Cafetero es patrimonio de la UNESCO desde 2011.',talk:'Dicen que un cura en Santander ponía como penitencia sembrar café, y así se regó por el país.',p:null,f:[['¿De dónde es originario el café?','De Etiopía.'],['¿Cuándo nació la Federación Nacional de Cafeteros?','En 1927.'],['¿Desde cuándo es patrimonio de la UNESCO el Paisaje Cultural Cafetero?','Desde 2011.']]},
 en:{t:'The history of coffee in Colombia',l:'Coffee originated in Ethiopia and passed through Yemen before reaching Europe and the Americas. It arrived in Colombia in the 18th century, probably with Jesuits; according to tradition, Father Francisco Romero assigned planting coffee bushes as penance.\n\nIn the 19th and early 20th centuries it became the engine of the economy and of the Antioquian settlement of the Coffee Region. The National Federation of Coffee Growers was founded in 1927, and the Juan Valdez character in 1958. Colombia is the world\'s largest producer of washed mild arabica; the Coffee Cultural Landscape has been a UNESCO World Heritage Site since 2011.',talk:'They say a priest in Santander gave planting coffee as penance, and that\'s how it spread across the country.',p:null,f:[['Where did coffee originate?','Ethiopia.'],['When was the National Federation of Coffee Growers founded?','In 1927.'],['Since when is the Coffee Cultural Landscape a UNESCO site?','Since 2011.']]}},
mathhist:{es:{t:'Los números que cambiaron la historia: cero, π y e',l:'El cero como número, con el que se puede operar, lo desarrollaron matemáticos de la India (Brahmagupta, siglo VII) y llegó a Europa por el mundo árabe junto con los numerales que usamos hoy. Sin él no existirían el sistema decimal ni los computadores.\n\nπ (≈ 3,14159) es la proporción entre la circunferencia y el diámetro de cualquier círculo; tiene infinitas cifras sin patrón. e (≈ 2,71828) aparece en todo lo que crece en proporción a sí mismo: intereses compuestos, poblaciones, desintegración radiactiva. Euler los unió en una sola fórmula: e^(iπ) + 1 = 0.',talk:'El cero que usamos lo inventaron en la India y llegó a Europa gracias a matemáticos árabes; por eso hablamos de números arábigos.',p:null,f:[['¿Dónde se desarrolló el cero como número?','En la India (Brahmagupta, siglo VII).'],['¿Qué representa π?','La proporción entre la circunferencia y el diámetro de un círculo.'],['¿Dónde aparece el número e?','En todo crecimiento proporcional a sí mismo: intereses compuestos, poblaciones.']]},
 en:{t:'Numbers that changed history: zero, pi and e',l:'Zero as a number you can calculate with was developed by Indian mathematicians (Brahmagupta, 7th century) and reached Europe through the Arab world, along with the numerals we use today. Without it there would be no decimal system and no computers.\n\nπ (≈ 3.14159) is the ratio of any circle\'s circumference to its diameter; its digits go on forever with no pattern. e (≈ 2.71828) shows up in anything that grows in proportion to itself: compound interest, populations, radioactive decay. Euler tied them together in one formula: e^(iπ) + 1 = 0.',talk:'The zero we use was invented in India and reached Europe through Arab mathematicians, which is why we call them Arabic numerals.',p:null,f:[['Where was zero developed as a number?','In India (Brahmagupta, 7th century).'],['What does π represent?','The ratio of a circle\'s circumference to its diameter.'],['Where does the number e appear?','In anything that grows in proportion to itself: compound interest, populations.']]}},
psych:{es:{t:'Por qué creemos en teorías conspirativas',l:'Las teorías conspirativas atraen porque satisfacen necesidades reales: dan una explicación sencilla a hechos confusos, una sensación de control y de saber algo que otros no saben, y un grupo al que pertenecer.\n\nNuestro cerebro busca patrones e intenciones incluso donde hay azar, y el sesgo de confirmación hace que solo veamos lo que encaja. Las conspiraciones reales existen (el caso Watergate), pero se descubren por pruebas, no por sospechas. Una buena prueba: ¿qué evidencia te haría cambiar de opinión? Si ninguna, la idea no es falsable.',talk:'Una buena pregunta ante una conspiración es: ¿qué prueba te haría cambiar de opinión? Si ninguna, no es una teoría, es una creencia.',p:null,f:[['Nombra dos necesidades que satisfacen las conspiraciones.','Explicación sencilla, sensación de control, sentirse especial, pertenecer a un grupo.'],['¿Qué sesgo las refuerza?','El sesgo de confirmación (y ver patrones en el azar).'],['¿Qué pregunta ayuda a evaluarlas?','¿Qué evidencia me haría cambiar de opinión?']]},
 en:{t:'Why people believe conspiracy theories',l:'Conspiracy theories appeal because they meet real needs: a simple explanation for confusing events, a sense of control and of knowing what others don\'t, and a group to belong to.\n\nOur brains look for patterns and intentions even in randomness, and confirmation bias makes us notice only what fits. Real conspiracies exist (Watergate), but they\'re uncovered by evidence, not suspicion. A good test: what evidence would change your mind? If nothing would, the idea isn\'t falsifiable.',talk:'A good question about any conspiracy theory: what evidence would change your mind? If nothing would, it\'s a belief, not a theory.',p:null,f:[['Name two needs conspiracy theories meet.','A simple explanation, sense of control, feeling special, belonging.'],['Which bias reinforces them?','Confirmation bias (and seeing patterns in randomness).'],['What question helps evaluate them?','What evidence would change my mind?']]}},
genrel:{es:{t:'Relatividad general: la gravedad como curvatura',l:'En 1915 Einstein propuso que la gravedad no es una fuerza que actúa a distancia, sino la deformación del espacio-tiempo por la masa y la energía. Una imagen útil: una bola pesada sobre una cama elástica hunde la tela, y una canica que pasa cerca gira a su alrededor.\n\nPredicciones confirmadas: la luz de las estrellas se curva al pasar cerca del Sol (eclipse de 1919), el tiempo pasa más lento cerca de grandes masas (por eso se corrige el GPS) y las ondas gravitacionales, detectadas en 2015 por LIGO tras el choque de dos agujeros negros.',talk:'Según Einstein, la Tierra no "atrae" a la Luna: la Luna sigue la curva que la masa de la Tierra hace en el espacio-tiempo.',p:null,f:[['¿Qué es la gravedad según la relatividad general?','La curvatura del espacio-tiempo causada por masa y energía.'],['¿Qué observación de 1919 la confirmó?','La curvatura de la luz estelar cerca del Sol en un eclipse.'],['¿Qué se detectó en 2015?','Ondas gravitacionales (LIGO).']]},
 en:{t:'General relativity: gravity as curvature',l:'In 1915 Einstein proposed that gravity isn\'t a force acting at a distance but the warping of spacetime by mass and energy. A helpful picture: a heavy ball on a trampoline dips the fabric, and a marble rolling nearby curves around it.\n\nConfirmed predictions: starlight bends as it passes the Sun (1919 eclipse), time runs slower near large masses (which is why GPS is corrected), and gravitational waves, detected in 2015 by LIGO after two black holes collided.',talk:'According to Einstein, Earth doesn\'t "pull" the Moon: the Moon follows the curve Earth\'s mass makes in spacetime.',p:null,f:[['What is gravity in general relativity?','The curving of spacetime by mass and energy.'],['What 1919 observation confirmed it?','Starlight bending near the Sun during an eclipse.'],['What was detected in 2015?','Gravitational waves (LIGO).']]}},
blackholes:{es:{t:'Agujeros negros',l:'Cuando una estrella muy grande (más de unas 20 veces el Sol) agota su combustible, su núcleo puede colapsar hasta formar un agujero negro: una región donde la gravedad es tan fuerte que nada sale una vez cruza el horizonte de eventos, ni siquiera la luz.\n\nEn el centro de casi todas las galaxias hay uno supermasivo; el de la Vía Láctea, Sagitario A*, tiene unos 4 millones de masas solares. En 2019 se publicó la primera imagen de uno (en la galaxia M87) y en 2022 la de Sagitario A*. Hawking predijo que emiten una radiación muy débil y se evaporan muy lentamente.',talk:'En el centro de nuestra galaxia hay un agujero negro de unos 4 millones de veces la masa del Sol, y ya tenemos foto de él.',p:null,f:[['¿Qué es el horizonte de eventos?','El límite a partir del cual nada, ni la luz, puede escapar.'],['¿Cómo se llama el agujero negro del centro de la Vía Láctea?','Sagitario A*.'],['¿Cuándo se publicó la primera imagen de un agujero negro?','En 2019 (galaxia M87).']]},
 en:{t:'Black holes',l:'When a very large star (more than about 20 times the Sun) runs out of fuel, its core can collapse into a black hole: a region where gravity is so strong that nothing gets out once it crosses the event horizon, not even light.\n\nAlmost every galaxy has a supermassive one at its center; the Milky Way\'s, Sagittarius A*, has about 4 million solar masses. The first image of one (in galaxy M87) was published in 2019, and Sagittarius A* in 2022. Hawking predicted they give off a very faint radiation and slowly evaporate.',talk:'At the center of our galaxy there\'s a black hole about 4 million times the Sun\'s mass, and we have a picture of it.',p:null,f:[['What is the event horizon?','The boundary beyond which nothing, not even light, can escape.'],['What is the Milky Way\'s central black hole called?','Sagittarius A*.'],['When was the first image of a black hole published?','In 2019 (galaxy M87).']]}},
dna:{es:{t:'ADN y genética',l:'El ADN es una molécula en forma de doble hélice (Watson, Crick, Franklin y Wilkins, 1953) que guarda instrucciones en cuatro letras: A, T, C y G. Tu genoma tiene unos 3.000 millones de letras y cerca de 20.000 genes, que son las recetas de las proteínas.\n\nHeredas la mitad de tu ADN de cada padre. Entre dos personas cualquiera las diferencias son de solo un 0,1%. El Proyecto Genoma Humano terminó la primera lectura completa en 2003, y la técnica CRISPR (Nobel 2020) permite editar genes con gran precisión, lo que abre tratamientos y también debates éticos.',talk:'Dos personas cualesquiera comparten más o menos el 99,9% del ADN; lo que nos hace distintos es una fracción mínima.',p:null,f:[['¿Qué forma tiene el ADN?','Doble hélice.'],['¿Cuántos genes tiene aproximadamente un humano?','Unos 20.000.'],['¿Qué técnica permite editar genes y ganó el Nobel en 2020?','CRISPR.']]},
 en:{t:'DNA and genetics',l:'DNA is a double-helix molecule (Watson, Crick, Franklin and Wilkins, 1953) that stores instructions in four letters: A, T, C and G. Your genome has about 3 billion letters and roughly 20,000 genes, the recipes for proteins.\n\nYou inherit half your DNA from each parent. Any two people differ by only about 0.1%. The Human Genome Project finished the first complete reading in 2003, and the CRISPR technique (Nobel 2020) lets us edit genes precisely, opening up treatments and ethical debates.',talk:'Any two people share about 99.9% of their DNA; what makes us different is a tiny fraction.',p:null,f:[['What shape is DNA?','A double helix.'],['About how many genes does a human have?','About 20,000.'],['Which gene-editing technique won the 2020 Nobel?','CRISPR.']]}},
immune:{es:{t:'Sistema inmune y vacunas',l:'El sistema inmune tiene dos capas. La innata responde rápido y en general a cualquier invasor (fiebre, inflamación). La adaptativa aprende: los linfocitos reconocen un microbio concreto, fabrican anticuerpos y guardan memoria durante años.\n\nUna vacuna muestra al cuerpo una parte inofensiva del microbio, o instrucciones para fabricarla, como las vacunas de ARNm, para que forme esa memoria sin pasar la enfermedad. Edward Jenner hizo la primera vacuna contra la viruela en 1796; gracias a la vacunación, la viruela se erradicó en 1980.',talk:'Una vacuna es un simulacro: el cuerpo practica contra el microbio sin tener que enfermarse de verdad.',p:null,f:[['¿Cuáles son las dos capas del sistema inmune?','La innata (rápida y general) y la adaptativa (específica y con memoria).'],['¿Quién hizo la primera vacuna y contra qué?','Edward Jenner, contra la viruela, en 1796.'],['¿Qué enfermedad se erradicó en 1980?','La viruela.']]},
 en:{t:'The immune system and vaccines',l:'The immune system has two layers. The innate one responds fast and broadly to any invader (fever, inflammation). The adaptive one learns: lymphocytes recognize a specific microbe, make antibodies and keep a memory for years.\n\nA vaccine shows the body a harmless piece of the microbe, or instructions to make it, like mRNA vaccines, so it builds that memory without the disease. Edward Jenner made the first vaccine, against smallpox, in 1796; thanks to vaccination, smallpox was eradicated in 1980.',talk:'A vaccine is a fire drill: the body practices against the microbe without actually getting sick.',p:null,f:[['What are the two layers of the immune system?','Innate (fast and general) and adaptive (specific, with memory).'],['Who made the first vaccine, and against what?','Edward Jenner, against smallpox, in 1796.'],['Which disease was eradicated in 1980?','Smallpox.']]}},
enso:{es:{t:'El Niño y La Niña',l:'Cada pocos años, el agua superficial del Pacífico tropical se calienta (El Niño) o se enfría (La Niña) más de lo normal. Ese cambio mueve las lluvias y los vientos de medio planeta. El nombre viene de pescadores peruanos que notaban aguas cálidas hacia Navidad, la época del "Niño Dios".\n\nEn Colombia, El Niño suele traer sequía, incendios y racionamientos (Bogotá racionó agua en 2024); La Niña trae lluvias e inundaciones, como en 2010-2011. Los episodios duran de meses a un par de años y se pronostican con varios meses de anticipación.',talk:'El nombre de El Niño viene de pescadores peruanos que veían el agua caliente cerca de Navidad.',p:null,f:[['¿Qué es El Niño?','El calentamiento anormal del Pacífico tropical.'],['¿Qué suele traer El Niño a Colombia?','Sequía, incendios y racionamientos.'],['¿De dónde viene el nombre?','De pescadores peruanos que veían aguas cálidas hacia Navidad.']]},
 en:{t:'El Niño and La Niña',l:'Every few years, the surface water of the tropical Pacific gets warmer (El Niño) or cooler (La Niña) than normal. That shift moves rainfall and winds across half the planet. The name comes from Peruvian fishermen who noticed warm water around Christmas, the time of the "Christ child" (El Niño).\n\nIn Colombia, El Niño usually brings drought, fires and rationing (Bogotá rationed water in 2024); La Niña brings rain and floods, as in 2010-2011. Episodes last from months to a couple of years and can be forecast several months ahead.',talk:'El Niño is named after Peruvian fishermen who saw warm water around Christmas.',p:null,f:[['What is El Niño?','Abnormal warming of the tropical Pacific.'],['What does El Niño usually bring to Colombia?','Drought, fires and rationing.'],['Where does the name come from?','Peruvian fishermen who saw warm water around Christmas.']]}},
periodic:{es:{t:'La tabla periódica',l:'En 1869 Dmitri Mendeléyev ordenó los elementos conocidos por su peso y notó que sus propiedades se repetían con un ritmo. Dejó huecos para elementos que aún no se conocían y predijo cómo serían; cuando se descubrieron, acertó.\n\nHoy se ordenan por número de protones y hay 118 elementos. Las columnas agrupan "familias" con comportamiento parecido: los metales alcalinos reaccionan violentamente con agua, los gases nobles casi no reaccionan con nada. Unos pocos elementos forman casi todo tu cuerpo: oxígeno, carbono, hidrógeno y nitrógeno.',talk:'Mendeléyev dejó huecos en su tabla para elementos que nadie había visto, y cuando aparecieron eran como él había dicho.',p:null,f:[['¿Quién creó la tabla periódica y cuándo?','Dmitri Mendeléyev, en 1869.'],['¿Cuántos elementos se conocen hoy?','118.'],['¿Qué cuatro elementos forman casi todo el cuerpo?','Oxígeno, carbono, hidrógeno y nitrógeno.']]},
 en:{t:'The periodic table',l:'In 1869 Dmitri Mendeleev arranged the known elements by weight and noticed their properties repeated in a rhythm. He left gaps for elements not yet known and predicted what they would be like; when they were discovered, he was right.\n\nToday elements are ordered by number of protons, and there are 118. Columns group "families" that behave alike: alkali metals react violently with water, noble gases barely react with anything. A few elements make up almost all of your body: oxygen, carbon, hydrogen and nitrogen.',talk:'Mendeleev left gaps in his table for elements no one had seen, and when they turned up they were just as he said.',p:null,f:[['Who created the periodic table, and when?','Dmitri Mendeleev, in 1869.'],['How many elements are known today?','118.'],['Which four elements make up almost all of the body?','Oxygen, carbon, hydrogen and nitrogen.']]}}

function dueToday(){var n=dayNum(today());return Object.keys(S.cards).filter(function(id){return S.cards[id].due<=n})}

var ORDER=(function(){var by={},seq=['f','b','g','c','s','l','e','p','m'],out=[];C.forEach(function(r){(by[r[1]]=by[r[1]]||[]).push(r[0])});
  for(var i=0;out.length<C.length;i++){seq.forEach(function(a){if(by[a]&&by[a][i])out.push(by[a][i])});if(i>200)break}return out})();
function unseen(){return ORDER.filter(function(id){return !S.cards[id]})}
function conceptIds(){return Object.keys(S.cards).filter(function(id){return !isFact(id)})}
function grade(id,r){
  var c=S.cards[id];var n=dayNum(today());
  if(r===0){c.box=1;c.lapses=(c.lapses||0)+1}else if(r===2){c.box=Math.min(6,c.box+1)}else{c.box=Math.max(1,c.box)}
  c.due=n+(r===1?Math.max(1,Math.ceil(DAYS[c.box]/2)):DAYS[c.box]);c.reps=(c.reps||0)+1;save();
}
function introduce(id){S.cards[id]={box:1,due:dayNum(today())+1,reps:0,lapses:0};save()}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function pickCases(n){
  var all=K.map(function(r){return r[0]});var now=dayNum(today());
  var score=function(id){var s=S.cases[id];if(!s)return 0;return (s.ok&&s.last===now?100:0)+(s.ok?10+Math.min(20,now-(s.last||0))*-1:-5)};
  return shuffle(all).sort(function(a,b){return score(a)-score(b)}).slice(0,n);
}
/* Connect uses curated pairs that really relate (random pairs gave things like "spectrum + overconfidence");
   least-practised first, preferring pairs where he has already seen at least one of the two concepts */
function pickPair(){
  var P=GM.PAIRS||[];if(P.length){S.pairs=S.pairs||{};
    var sc=function(p){var seen=(S.cards[p[0]]?1:0)+(S.cards[p[1]]?1:0);return (S.pairs[p[0]+'+'+p[1]]||0)*10-seen*3+Math.random()};
    var best=P.slice().sort(function(x,y){return sc(x)-sc(y)})[0];return [best[0],best[1],best]}
  var pool=conceptIds();if(pool.length<4)pool=C.map(function(r){return r[0]});
  var a=pool[Math.floor(Math.random()*pool.length)];var others=pool.filter(function(x){return CONCEPTS[x].area!==CONCEPTS[a].area});
  return [a,others[Math.floor(Math.random()*others.length)]];
}

var STOP=('porque cuando aunque entonces donde mientras siempre ninguna ninguno nuestro nuestra puede pueden tiene tienen hacer hacen sobre entre desde hasta otros otras todos todas mucho muchos menos parte forma manera cosas because without through another between their there these those which while where would could should about other every always never often being makes things something').split(' ');
function norm(x){return String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function keyWords(ref){var seen={},out=[],min=ref.length<80?4:6;norm(ref).split(/[^a-z0-9ñ]+/).forEach(function(w){if((w.length<min&&!/^[0-9]{2,}$/.test(w))||STOP.indexOf(w)>=0)return;var k=w.slice(0,5);if(seen[k])return;seen[k]=1;out.push(w)});return out.sort(function(a,b){return b.length-a.length}).slice(0,6)}
/* synonyms: stem (first 5 letters) -> stems of every word in its group */
var SYNMAP=(function(){var m={};(GM.SYN||[]).forEach(function(g){var st=g.map(function(w){return norm(w).slice(0,5)});st.forEach(function(s){m[s]=(m[s]||[]).concat(st)})});return m})();
function said(tx,w){var s=w.slice(0,5);if(tx.indexOf(s)>=0)return true;return (SYNMAP[s]||[]).some(function(x){return x.length>=3&&new RegExp('(^|[^a-z])'+x).test(tx)})}
function keyHits(ref,text,exclude){var ex=exclude?norm(exclude):'',ks=keyWords(ref).filter(function(w){return ex.indexOf(w.slice(0,5))<0});if(!ks.length)return '';var tx=norm(text),hit=ks.filter(function(w){return said(tx,w)});
  var sug=!text.trim()||hit.length===0?0:hit.length>=Math.ceil(ks.length/2)?2:1;cur.sug=sug;cur.hits=hit.length+'/'+ks.length;
  return '<div class="keys"><p class="small">'+t('keysL',{h:hit.length,n:ks.length})+' '+t('sug'+sug)+'</p><div class="kw">'+ks.map(function(w){return '<span class="'+(hit.indexOf(w)>=0?'on':'')+'">'+esc(w)+'</span>'}).join('')+'</div></div>'}
function renderFact(st,it){
  var f=S.facts[it.id];if(!f){nextItem();return}
  var h=head('b1',(cur.i+1)+' / '+cur.items.length)+'<div class="row"><span class="area c">'+esc(f.topic)+'</span> <span class="small">'+t('review')+'</span></div><div class="concept">'+esc(f.q)+'</div><p class="small">'+t('factQ')+'</p><textarea id="rt" aria-label="'+esc(f.q)+'">'+esc(cur.text)+'</textarea>';
  if(!cur.revealed){h+='<div class="row"><button class="btn primary" id="rv" disabled>'+t('reveal')+'</button><button class="btn" id="dk">'+t('dontKnow')+'</button></div>';st.innerHTML=h;
    var rvb=$('rv');rvb.disabled=cur.text.trim().length<3;$('rt').oninput=function(e){cur.text=e.target.value;rvb.disabled=cur.text.trim().length<3};
    $('rv').onclick=function(){cur.text=$('rt').value;cur.revealed=true;render()};$('dk').onclick=function(){cur.text='';cur.revealed=true;render()};return}
  chatOpen('f:'+it.id,'Pregunta: '+f.q+' Respuesta correcta: '+f.a+'\nRespuesta de Brayan: "'+(cur.text||'(no supo)')+'"',cur.text.trim()?(L()==='en'?'Is my answer right? Add one interesting fact about it.':'¿Mi respuesta es correcta? Añade un dato interesante sobre esto.'):null);
  h+='<div class="def"><p>'+esc(f.a)+'</p></div>'+keyHits(f.a,cur.text,f.q)+'<div id="chat" class="chat"></div><div class="row"><button class="btn rate-0" data-r="0">'+t('rate0')+'</button><button class="btn rate-1" data-r="1">'+t('rate1')+'</button><button class="btn rate-2" data-r="2">'+t('rate2')+'</button></div>';
  st.innerHTML=h;var sf=st.querySelector('[data-r="'+(cur.sug==null?1:cur.sug)+'"]');if(sf)sf.classList.add('sugg');
  st.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){var r=+b.getAttribute('data-r');logAnswer({k:'fact',id:it.id,q:f.q,a:cur.text,hits:cur.hits||'',rate:r});grade(it.id,r);nextItem()}});
}
function topicName(id){var r=TOPICS.filter(function(x){return x[0]===id})[0];return r?(L()==='en'?r[2]:r[1]):id}
function makeLesson(){var id=cur.topic,ls=LESSONS[id];if(!ls){cur.lesson={err:true};render();return}var x=ls[L()];
  cur.lesson={topic:id,title:x.t,lesson:x.l,perspectives:x.p||null,talk:x.talk||'',facts:x.f.map(function(f){return {q:f[0],a:f[1]}})};render();window.scrollTo(0,0)}
function saveLesson(){
  var ls=cur.lesson,n=dayNum(today()),lid=today()+'-'+ls.topic;
  ls.facts.forEach(function(f,i){var fid='f:'+lid+':'+i;S.facts[fid]={q:f.q,a:f.a,topic:ls.title};S.cards[fid]={box:1,due:n+1,reps:0,lapses:0}});
  S.lessons.unshift({id:lid,date:today(),topic:ls.topic,title:ls.title,lesson:ls.lesson,perspectives:ls.perspectives,talk:ls.talk,lang:L()});
  if(ls.topic===TOPICS[S.ti%TOPICS.length][0])S.ti++;save();
}
function finishSession(){CHAT=null;if(S.days.indexOf(today())<0)S.days.push(today());save();cur.block=5;render();window.scrollTo(0,0)}
function renderDiscover(st){
  var h=head('b4')+'<p class="small">'+t('discQ')+'</p>';
  var ls=cur.lesson;
  if(!ls){h+='<div class="concept">'+esc(topicName(cur.topic))+'</div><div class="row"><button class="btn primary" id="mk">'+t('b4')+'</button><button class="btn" id="fin">'+t('skip')+'</button></div><p class="small">'+t('pick')+'</p><div class="topics">'+
      TOPICS.map(function(r){return '<button class="btn" data-tp="'+r[0]+'">'+esc(L()==='en'?r[2]:r[1])+'</button>'}).join('')+'</div>';
    st.innerHTML=h;$('mk').onclick=makeLesson;$('fin').onclick=finishSession;
    st.querySelectorAll('[data-tp]').forEach(function(b){b.onclick=function(){cur.topic=b.getAttribute('data-tp');makeLesson()}});return}
  if(ls.wait){st.innerHTML=h+'<p class="fb wait">'+t('gen')+'</p>';return}
  if(ls.err){st.innerHTML=h+'<p class="small">'+t('genErr')+'</p><div class="row"><button class="btn" id="re">'+t('b4')+'</button><button class="btn primary" id="fin">'+t('finish')+'</button></div>';$('re').onclick=makeLesson;$('fin').onclick=finishSession;return}
  h+='<div class="concept">'+esc(ls.title)+'</div><div class="lesson">'+esc(ls.lesson)+'</div>';chatOpen('l:'+ls.topic,'Lección: '+ls.title+'. '+ls.lesson,null);
  if(ls.perspectives&&ls.perspectives.length===2)h+='<h3>'+t('perspL')+'</h3><div class="persp"><div>'+esc(ls.perspectives[0])+'</div><div>'+esc(ls.perspectives[1])+'</div></div>';
  if(ls.talk)h+='<p class="small">'+t('talkL')+'</p><p class="talk">'+esc(ls.talk)+'</p>';
  h+='<div id="chat" class="chat"></div><h3>'+t('keyL')+'</h3><ul>'+ls.facts.map(function(f){return '<li>'+esc(f.q)+'</li>'}).join('')+'</ul><div class="row"><button class="btn primary" id="fin">'+t('finish')+'</button></div>';
  st.innerHTML=h;$('fin').onclick=function(){saveLesson();finishSession()};
}
function renderKnow(){
  if(!S.lessons.length){$('know').innerHTML='<p class="empty">'+t('noKnow')+'</p>';return}
  $('know').innerHTML=S.lessons.map(function(l){return '<details class="entry"><summary><span class="meta">'+esc(l.date)+'</span><br><b>'+esc(l.title)+'</b></summary><div class="lesson">'+esc(l.lesson)+'</div>'+(l.talk?'<p class="talk">'+esc(l.talk)+'</p>':'')+'</details>'}).join('');
}
/* remember what he wrote (and how it went) so Claude can review it in chat later */
function logAnswer(o){S.answers=S.answers||[];o.d=today();o.lang=L();S.answers.push(o);if(S.answers.length>800)S.answers=S.answers.slice(-800)}
function nextItem(){CHAT=null;cur.i++;cur.revealed=false;cur.text='';cur.dk=false;cur.sug=null;cur.fb=null;if(cur.i>=cur.items.length)cur.block=2;render();window.scrollTo(0,0)}
function renderConnect(st){
  var a=cur.pair[0],b=cur.pair[1],P=cur.pair[2];
  var box=function(id){return '<button class="c ctap" type="button" data-cid="'+id+'">'+areaTag(id)+'<b>'+esc(cn(id))+'</b><span class="small tapme">'+t('tapDef')+'</span><span class="cdef" hidden>'+esc(CONCEPTS[id].d[L()])+'<br><i>'+esc(CONCEPTS[id].x[L()])+'</i></span></button>'};
  var h=head('b2')+'<div class="pair">'+box(a)+'<span class="plus">+</span>'+box(b)+'</div>';
  if(cur.connDone){ /* after he writes (or skips): one possible connection, to compare with his */
    h+=(cur.connText.trim()?'<div class="entry"><span class="meta">'+t('yourConn')+'</span><div>'+esc(cur.connText.trim())+'</div></div>':'')+
      (P?'<div class="def"><p><b>'+t('oneConn')+'</b> '+esc(L()==='en'?P[5]:P[4])+'</p></div>':'')+'<div id="chat" class="chat"></div><div class="row"><button class="btn primary" id="cn">'+t('next')+'</button></div>';
    chatOpen('c:'+a+b,'Conectar: '+CONCEPTS[a].n.es+' ('+CONCEPTS[a].d.es+') y '+CONCEPTS[b].n.es+' ('+CONCEPTS[b].d.es+'). Una conexión posible: '+(P?P[4]:'')+'\nConexión de Brayan: "'+(cur.connText.trim()||'(no escribió)')+'"',cur.connText.trim()?(L()==='en'?'Is my connection real and well reasoned? Point out any misunderstanding and one sharper connection.':'¿Mi conexión es real y está bien razonada? Señala si hay algún error y propón una conexión más aguda.'):null);
    st.innerHTML=h;wireDefs(st);$('cn').onclick=function(){cur.fb=null;cur.connDone=false;CHAT=null;cur.block=3;render();window.scrollTo(0,0)};return}
  h+='<p>'+t('connQ')+'</p>'+(P?'<p class="note small"><b>'+t('hintL')+'</b> '+esc(L()==='en'?P[3]:P[2])+'</p>':'')+
    '<textarea id="ct" placeholder="'+esc(t('connPh'))+'" aria-label="'+esc(t('connQ'))+'">'+esc(cur.connText)+'</textarea>'+
    '<div class="row"><button class="btn primary" id="sv">'+t('save')+'</button><button class="btn" id="sk">'+t('showConn')+'</button></div>';
  st.innerHTML=h;wireDefs(st);var ta=$('ct');ta.oninput=function(e){cur.connText=e.target.value};
  var finish=function(){S.pairs=S.pairs||{};var key=a+'+'+b;S.pairs[key]=(S.pairs[key]||0)+1;save();cur.connDone=true;render()};
  $('sv').onclick=function(){cur.connText=ta.value;if(cur.connText.trim()){logAnswer({k:'connect',id:a+'+'+b,q:CONCEPTS[a].n.es+' + '+CONCEPTS[b].n.es,a:cur.connText.trim()});S.journal.unshift({date:today(),a:a,b:b,text:cur.connText.trim(),fb:null});save()}finish()};
  $('sk').onclick=function(){cur.connText='';finish()};
}
function wireDefs(st){st.querySelectorAll('.ctap').forEach(function(x){x.onclick=function(){var d=x.querySelector('.cdef'),tp=x.querySelector('.tapme');d.hidden=!d.hidden;tp.hidden=!d.hidden}})}
function renderApply(st){
  var k=CASES[cur.cases[cur.ci]];
  if(!cur.choices||cur.choices.k!==k.id){
    var same=C.filter(function(r){return r[0]!==k.c&&r[1]===CONCEPTS[k.c].area}).map(function(r){return r[0]});
    var rest=C.filter(function(r){return r[0]!==k.c&&r[1]!==CONCEPTS[k.c].area}).map(function(r){return r[0]});
    var d=shuffle(same).slice(0,2).concat(shuffle(rest).slice(0,1));cur.choices={k:k.id,list:shuffle(d.concat(k.c))};
  }
  var h=head('b3',(cur.ci+1)+' / '+cur.cases.length)+'<p class="scenario">'+esc(k.q[L()])+'</p><p class="small">'+t('applyQ')+'</p><div class="choices">'+
    cur.choices.list.map(function(id){var cls='choice';if(cur.answered){if(id===k.c)cls+=' ok';else if(id===cur.answered)cls+=' no'}
      return '<button class="'+cls+'" data-c="'+id+'"'+(cur.answered?' disabled':'')+'>'+esc(cn(id))+'</button>'}).join('')+'</div>';
  if(cur.answered){var ok=cur.answered===k.c;chatOpen('a:'+k.id,'Caso: '+k.q[L()]+' Concepto correcto: '+cn(k.c)+'. Por qué: '+k.w[L()]+' Brayan eligió: '+cn(cur.answered),null);
    h+='<p class="result '+(ok?'ok':'no')+'">'+(ok?t('right'):esc(t('wrong',{c:cn(k.c)})))+'</p><p class="why">'+esc(k.w[L()])+'</p><div id="chat" class="chat"></div><div class="row"><button class="btn primary" id="nx">'+t('next')+'</button></div>'}
  st.innerHTML=h;
  st.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){if(cur.answered)return;cur.answered=b.getAttribute('data-c');var ok=cur.answered===k.c;
    var s=S.cases[k.id]||(S.cases[k.id]={n:0,okN:0});s.n++;if(ok)s.okN++;s.ok=ok;s.last=dayNum(today());logAnswer({k:'apply',id:k.id,q:k.q.es,a:cn(cur.answered),ok:ok});
    if(S.cards[k.c]&&!ok){S.cards[k.c].due=Math.min(S.cards[k.c].due,dayNum(today())+1)}save();render()}});
  if($('nx'))$('nx').onclick=function(){CHAT=null;cur.ci++;cur.answered=null;if(cur.ci>=cur.cases.length){cur.block=cur.again?5:4}render();window.scrollTo(0,0)};
}
function renderDone(st){
  var n=stats();var d=dayNum(today())+1;var tomorrow=Object.keys(S.cards).filter(function(id){return S.cards[id].due<=d}).length;
  st.innerHTML='<div class="done-hero"><div class="big">'+n+'</div><h2>'+t('doneT')+'</h2><p class="small">'+t(n===1&&L()==='es'?'doneS1':'doneS',{n:n,d:tomorrow})+'</p></div><div class="row" style="justify-content:center"><button class="btn" id="ag">'+t('again')+'</button></div>';
  $('ag').onclick=function(){cur.cases=pickCases(3);cur.ci=0;cur.answered=null;cur.block=3;cur.again=true;render()};
}

/* ---------------- library + journal + settings ---------------- */
function renderLib(){
  var h='';Object.keys(AREAS).forEach(function(a){
    h+='<div class="libgroup"><span class="area '+a+'" style="align-self:flex-start">'+esc(AREAS[a][L()])+'</span>';
    C.filter(function(r){return r[1]===a}).forEach(function(r){var c=CONCEPTS[r[0]],s=S.cards[r[0]],box=s?s.box:0,dots='';
      for(var i=1;i<=5;i++)dots+='<i class="'+(box>=i?'on':'')+'"></i>';
      h+='<button class="libitem" data-id="'+c.id+'"><span class="nm">'+esc(c.n[L()])+'</span><span class="dots" aria-label="'+box+'/5">'+dots+'</span><span class="dd" hidden>'+esc(c.d[L()])+'<br><i>'+esc(c.x[L()])+'</i></span></button>'});
    h+='</div>'});
  $('lib').innerHTML=h;
  $('lib').querySelectorAll('.libitem').forEach(function(b){b.onclick=function(){var d=b.querySelector('.dd');d.hidden=!d.hidden}});
}
function renderJournal(){
  if(!S.journal.length){$('journal').innerHTML='<p class="empty">'+t('noJournal')+'</p>';return}
  $('journal').innerHTML=S.journal.map(function(j){return '<div class="entry"><span class="meta">'+esc(j.date)+' · '+esc(cn(j.a))+' + '+esc(cn(j.b))+'</span><div>'+esc(j.text)+'</div>'+(j.fb?'<div class="fb">'+esc(j.fb)+'</div>':'')+'</div>'}).join('');
}
function renderSet(){
  $('npd').innerHTML=[1,2,3,4].map(function(n){return '<button class="btn'+(S.npd===n?' primary':'')+'" data-n="'+n+'">'+n+'</button>'}).join('');
  $('npd').querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){S.npd=+b.getAttribute('data-n');save();renderSet()}});
}
$('bCopy').onclick=function(){var s=JSON.stringify(S);$('iBackup').value=s;
  try{navigator.clipboard.writeText(s).then(function(){$('bkMsg').textContent=t('copied')},function(){$('iBackup').select();$('bkMsg').textContent=t('selectIt')})}catch(e){$('iBackup').select();$('bkMsg').textContent=t('selectIt')}};
$('bRestore').onclick=function(){try{var o=JSON.parse($('iBackup').value);if(!o.cards)throw 0;S=Object.assign(blank(),o);save();cur=null;applyLang();$('bkMsg').textContent=t('restored')}catch(e){$('bkMsg').textContent=t('badBackup')}};
var armed=false;$('bReset').onclick=function(){if(!armed){armed=true;$('bReset').textContent=t('resetArm');setTimeout(function(){armed=false;$('bReset').textContent=t('reset')},4000);return}
  var lang=S.lang;S=blank();S.lang=lang;save();cur=null;armed=false;applyLang();$('bkMsg').textContent=t('wiped')};

/* ---------------- tabs + language ---------------- */
function openTab(id){document.querySelectorAll('.tab').forEach(function(x){var on=x.dataset.p===id;x.setAttribute('aria-selected',on);$(x.dataset.p).hidden=!on});
  if(id==='p-lib')renderLib();if(id==='p-know')renderKnow();if(id==='p-journal')renderJournal();if(id==='p-set')renderSet()}
document.querySelectorAll('.tab').forEach(function(x){x.onclick=function(){openTab(x.dataset.p)}});
function applyLang(){
  document.documentElement.lang=L();
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.getAttribute('data-t'))});
  $('lEs').setAttribute('aria-pressed',L()==='es');$('lEn').setAttribute('aria-pressed',L()==='en');
  render();var open=document.querySelector('.tab[aria-selected="true"]');if(open)openTab(open.dataset.p);
}
$('lEs').onclick=function(){S.lang='es';save();applyLang()};
$('lEn').onclick=function(){S.lang='en';save();applyLang()};
applyLang();
if(OPEN_URL){fetch(OPEN_URL,{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(x){if(typeof x==='string'){mergeIn(JSON.parse(x));if(!cur)render()}}).catch(function(){}).then(function(){cloudSync()})}
})();

</script>
