/* Layout: one calm column. Header with streak + language switch, tabs, then the session card that walks Recall → Connect → Apply. */

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.lang button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 .8rem var(--f-mono);padding:6px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}

.steps span.on{background:var(--accent)} .steps span.done{background:var(--accent);opacity:.45}
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.area.m{color:var(--a-m)} .area.p{color:var(--a-p)} .area.e{color:var(--a-e)} .area.s{color:var(--a-s)} .area.l{color:var(--a-l)} .area.c{color:var(--a-c)}
.concept{font-family:var(--f-display);font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.def{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.def p{margin:0} .def p+p{margin-top:8px}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.def .ex{color:var(--muted);font-size:.95rem}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}

.scenario{font-size:1.05rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;font:600 .92rem var(--f-body);cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.ok{border-color:var(--good);background:var(--accent-soft)}
.choice.no{border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
textarea{width:100%;min-height:96px;resize:vertical;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:400 .98rem/1.45 var(--f-body)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9rem var(--f-body);padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.rate-0{border-color:var(--bad);color:var(--bad)} .btn.rate-1{border-color:var(--warn);color:var(--warn)} .btn.rate-2{border-color:var(--good);color:var(--good)}
.btn:disabled{opacity:.45;cursor:default}
.fb{border-left:3px solid var(--accent);padding:6px 0 6px 12px;color:var(--ink);white-space:pre-wrap}
.fb.wait{color:var(--muted)}
.why{border-left:3px solid var(--line);padding:4px 0 4px 12px;color:var(--muted)}
.result{font-weight:700} .result.ok{color:var(--good)} .result.no{color:var(--bad)}
.small{font-size:.85rem;color:var(--muted)}
.lib{display:flex;flex-direction:column;gap:18px}
.libgroup{display:flex;flex-direction:column;gap:6px}
.libitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.libitem .nm{font-weight:600}
.libitem .dd{grid-column:1/-1;color:var(--muted);font-size:.92rem}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.entry .meta{font:600 .72rem var(--f-mono);color:var(--muted);letter-spacing:.04em}
.lesson{font-size:1.02rem;white-space:pre-wrap}
.persp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.persp div{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.93rem}
.talk{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-style:italic}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.topics .btn{padding:6px 10px;font-size:.82rem}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.done-hero{text-align:center;padding:10px 0}
.done-hero .big{font:700 3rem var(--f-display);color:var(--accent);line-height:1}
@media (max-width:480px){.persp{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.choices{grid-template-columns:1fr}.pair{grid-template-columns:1fr}.pair .plus{text-align:center}h1{font-size:1.9rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.tab[aria-selected="true"]{color:var(--accent)}

.msgs{display:flex;flex-direction:column;gap:8px}

<script>
/* Gimnasio Mental content: concepts C, real-life cases K, Discover topics and static lessons. Broad general knowledge on purpose (by request: not job topics). */
var AREAS={m:{es:'Matemáticas',en:'Math'},p:{es:'Probabilidad y estadística',en:'Probability & statistics'},e:{es:'Economía y decisiones',en:'Economics & decisions'},s:{es:'Psicología y sesgos',en:'Psychology & biases'},l:{es:'Lógica y argumentos',en:'Logic & arguments'},c:{es:'Sistemas y ciencia',en:'Systems & science'},f:{es:'Física y universo',en:'Physics & the universe'},b:{es:'Vida y cuerpo',en:'Life & the body'},g:{es:'La Tierra',en:'Planet Earth'}};
var C=[
 ['exp','m','Crecimiento exponencial','Exponential growth','Algo crece en proporción a su tamaño actual, así que se duplica en tiempos iguales. Regla del 72: años para duplicar ≈ 72 ÷ % de crecimiento anual.','Something grows in proportion to its current size, so it doubles in equal time steps. Rule of 72: years to double ≈ 72 ÷ annual growth rate in %.','Al 8% anual, un ahorro se duplica en unos 9 años.','At 8% a year, savings double in about 9 years.'],
 ['log','m','Pensamiento logarítmico','Logarithmic thinking','Cuando las cantidades varían en órdenes de magnitud, compara proporciones, no diferencias: de 10 a 100 es el mismo salto que de 100 a 1.000.','When quantities span orders of magnitude, compare ratios, not differences: 10 to 100 is the same jump as 100 to 1,000.','Un sismo de magnitud 7 tiene 10 veces la amplitud de uno de 6.','A magnitude 7 earthquake has 10 times the amplitude of a 6.'],
 ['fermi','m','Estimación de Fermi','Fermi estimation','Parte una pregunta "imposible" en factores que sí puedes estimar y multiplícalos; los errores de cada factor tienden a compensarse.','Break an "impossible" question into factors you can estimate and multiply them; errors in each factor tend to cancel out.','¿Cuántas motos hay en Bogotá? Hogares × fracción con moto × motos por hogar.','How many motorcycles are in Bogotá? Households × share with a bike × bikes per household.'],
 ['invariant','m','Invariantes','Invariants','Busca una cantidad que no cambia aunque el sistema cambie; suele resolver problemas que parecen complicados.','Look for a quantity that stays the same while everything else changes; it often cracks problems that look complicated.','Un tablero sin dos esquinas opuestas no se cubre con dominós: cada ficha tapa una blanca y una negra, y faltan dos del mismo color.','A chessboard missing two opposite corners can\'t be tiled with dominoes: each tile covers one light and one dark square, and both missing squares share a color.'],
 ['pigeon','m','Principio del palomar','Pigeonhole principle','Si repartes n+1 objetos en n cajas, al menos una caja tiene dos o más.','If you put n+1 items into n boxes, at least one box holds two or more.','En un grupo de 367 personas, dos cumplen años el mismo día con total seguridad.','In any group of 367 people, two share a birthday, guaranteed.'],
 ['extreme','m','Casos extremos','Extreme cases','Prueba una idea con valores límite (0, 1, muy grande) para ver si sigue teniendo sentido; es la forma más rápida de detectar una fórmula mala.','Test an idea with boundary values (0, 1, huge) to see if it still makes sense; it\'s the fastest way to catch a broken formula.','Si una fórmula de descuento da precio negativo al 100% de descuento, está mal.','If a discount formula gives a negative price at 100% off, it\'s wrong.'],
 ['nonlin','m','No linealidad','Nonlinearity','El efecto no es proporcional a la causa: hay umbrales, saturación y rendimientos decrecientes.','Effects aren\'t proportional to causes: there are thresholds, saturation and diminishing returns.','Dormir 5 horas no te deja al 60%: el rendimiento cae mucho más.','Sleeping 5 hours doesn\'t leave you at 60%: performance drops far more.'],
 ['network','m','Redes y nodos clave','Networks and hubs','Muchos sistemas son nodos y conexiones; los nodos muy conectados dominan cómo se propaga algo.','Many systems are nodes and links; highly connected hubs dominate how things spread.','Un rumor se riega rápido si llega a la persona que habla con todos.','A rumor spreads fast once it reaches the person who talks to everyone.'],
 ['base','p','Tasa base','Base rate','Antes de mirar la evidencia, pregunta qué tan común es el caso en general; ignorarlo es la falacia de la tasa base.','Before looking at the evidence, ask how common the thing is in general; ignoring that is the base-rate fallacy.','Con una enfermedad de 1 en 10.000, casi todos los positivos de una prueba "99% precisa" son falsos.','With a 1-in-10,000 disease, almost every positive from a "99% accurate" test is false.'],
 ['bayes','p','Actualización bayesiana','Bayesian updating','Tu nueva creencia = la previa ajustada por cuánto más probable es la evidencia si la hipótesis es cierta que si no lo es.','Your new belief = your prior, adjusted by how much more likely the evidence is if the hypothesis is true than if it isn\'t.','Un colega puntual llega tarde: es más probable un imprevisto que descuido.','A punctual coworker is late: an incident is likelier than carelessness.'],
 ['regress','p','Regresión a la media','Regression to the mean','Tras un resultado extremo suele venir uno más normal, por puro azar, aunque nada haya cambiado.','An extreme result is usually followed by a more ordinary one, by chance alone, even if nothing changed.','Después de tu peor semana en ajedrez, la siguiente suele ser mejor, entrenes o no.','After your worst chess week, the next one is usually better, whether you train or not.'],
 ['lln','p','Ley de los grandes números','Law of large numbers','Con muchas observaciones el promedio se acerca al valor real; con pocas, domina el azar.','With many observations the average approaches the true value; with few, luck dominates.','5 partidas no dicen nada de una apertura; 200 sí.','5 games tell you nothing about an opening; 200 do.'],
 ['corr','p','Correlación no es causalidad','Correlation isn\'t causation','Dos cosas que se mueven juntas pueden tener una causa común, ir al revés o ser casualidad.','Two things moving together may share a hidden cause, run the other way, or be coincidence.','Helados y ahogamientos suben juntos porque ambos dependen del calor.','Ice cream sales and drownings rise together because both follow hot weather.'],
 ['surv','p','Sesgo de supervivencia','Survivorship bias','Solo ves los casos que pasaron el filtro; los que fracasaron no aparecen en los datos.','You only see the cases that made it through the filter; the failures never show up in the data.','En la II Guerra se reforzaron los aviones donde los que volvían NO tenían agujeros.','In WWII, planes were armored where returning planes had NO holes.'],
 ['selection','p','Sesgo de selección','Selection bias','La muestra no representa a la población porque la forma de elegirla está ligada al resultado.','The sample doesn\'t represent the population because how it was chosen is tied to the outcome.','Una encuesta en Instagram sobre cuánto usa la gente Instagram.','An Instagram poll about how much people use Instagram.'],
 ['ev','p','Valor esperado','Expected value','Promedio de los resultados posibles ponderados por su probabilidad; guía las decisiones que se repiten.','The average of possible outcomes weighted by their probabilities; it guides decisions you make repeatedly.','10% de ganar 1.000.000 vale en promedio 100.000.','A 10% shot at 1,000,000 is worth 100,000 on average.'],
 ['var','p','Varianza y riesgo','Variance and risk','Dos opciones con el mismo promedio pueden tener riesgos muy distintos; importa la dispersión, no solo la media.','Two options with the same average can carry very different risk; the spread matters, not just the mean.','Sueldo fijo vs comisiones con el mismo promedio anual.','A fixed salary vs commissions with the same yearly average.'],
 ['fat','p','Colas pesadas','Fat tails','En algunos fenómenos los extremos son mucho más frecuentes de lo que predice la curva normal y dominan el total.','In some phenomena extremes are far more common than the normal curve predicts, and they dominate the total.','Unas pocas películas o libros concentran la mayoría de las ventas.','A few films or books make most of the sales.'],
 ['simpson','p','Paradoja de Simpson','Simpson\'s paradox','Una tendencia que aparece en cada grupo puede invertirse al juntarlos, por cómo se reparten los casos.','A trend that shows up in every group can reverse when the groups are combined, because of how cases are distributed.','Un hospital mejor con graves y con leves puede verse peor en total si atiende muchos más graves.','A hospital better for both severe and mild cases can look worse overall if it treats far more severe ones.'],
 ['opp','e','Costo de oportunidad','Opportunity cost','El verdadero costo de algo es la mejor alternativa a la que renuncias por elegirlo.','The real cost of anything is the best alternative you give up to get it.','Un trabajo extra el sábado cuesta también las horas de estudio que pierdes.','Saturday overtime also costs the study hours you lose.'],
 ['marg','e','Pensamiento marginal','Marginal thinking','Decide mirando el beneficio y el costo de una unidad más, no el total.','Decide by looking at the benefit and cost of one more unit, not the total.','La quinta hora de estudio rinde menos que la primera.','Your fifth hour of study yields less than your first.'],
 ['sunk','e','Costo hundido','Sunk cost','Lo ya gastado no se recupera, así que no debería pesar al decidir si seguir.','What\'s already spent is gone, so it shouldn\'t weigh on whether to continue.','Seguir viendo una película mala porque ya pagaste la entrada.','Sitting through a bad movie because you already paid.'],
 ['incent','e','Incentivos','Incentives','La gente responde a lo que se premia y se castiga; para predecir conductas, mira los incentivos.','People respond to what gets rewarded and punished; to predict behavior, look at the incentives.','Pagar por líneas de código produce código innecesariamente largo.','Paying per line of code produces needlessly long code.'],
 ['second','e','Efectos de segundo orden','Second-order effects','Pregunta "¿y después qué?": las consecuencias de las consecuencias suelen ser las importantes.','Ask "and then what?": the consequences of the consequences are often what matters.','Ampliar una vía atrae más carros y vuelve el trancón.','Widening a road attracts more cars and the traffic jam returns.'],
 ['compadv','e','Ventaja comparativa','Comparative advantage','Conviene especializarse en lo que haces con menor costo de oportunidad, aunque otro sea mejor en todo.','It pays to specialize in what you do at the lowest opportunity cost, even if someone else is better at everything.','Un abogado que digita rápido igual contrata un asistente: su hora vale más en casos.','A lawyer who types fast still hires an assistant: their hour is worth more on cases.'],
 ['goodhart','e','Ley de Goodhart','Goodhart\'s law','Cuando una medida se convierte en meta, deja de ser una buena medida.','When a measure becomes a target, it stops being a good measure.','Premiar llamadas cortas en un call center produce llamadas cortas sin resolver.','Rewarding short calls in a call center produces short, unresolved calls.'],
 ['confirm','s','Sesgo de confirmación','Confirmation bias','Buscamos y recordamos lo que confirma lo que ya creemos, e ignoramos lo que lo contradice.','We seek and remember what confirms what we already believe, and ignore what contradicts it.','Revisar solo las partidas que ganaste con tu apertura favorita.','Reviewing only the games you won with your favorite opening.'],

 ['avail','s','Heurística de disponibilidad','Availability heuristic','Juzgamos qué tan frecuente es algo por lo fácil que nos viene un ejemplo a la mente.','We judge how common something is by how easily an example comes to mind.','Tras ver noticias de un accidente aéreo, volar parece más peligroso que manejar.','After plane-crash news, flying feels more dangerous than driving.'],
 ['overconf','s','Exceso de confianza','Overconfidence','Creemos saber y predecir mejor de lo que realmente lo hacemos; los proyectos casi siempre tardan más de lo planeado.','We think we know and predict better than we do; projects almost always take longer than planned.','"Esto me toma dos semanas", y toma cuatro, otra vez.','"This will take two weeks," and it takes four, again.'],

 ['falsif','l','Falsabilidad','Falsifiability','Una afirmación útil dice qué observación la demostraría falsa; si nada puede refutarla, no informa nada.','A useful claim states what observation would prove it wrong; if nothing could refute it, it tells you nothing.','"Esta semana tendrás retos y oportunidades" nunca falla, por eso no sirve.','"This week brings challenges and opportunities" can\'t fail, so it\'s useless.'],

 ['necsuf','l','Necesario vs suficiente','Necessary vs sufficient','Necesario: sin eso no ocurre. Suficiente: con eso basta. Confundirlos lleva a falsas expectativas.','Necessary: without it, it won\'t happen. Sufficient: it\'s enough on its own. Mixing them up creates false expectations.','Saber Python es necesario para ciencia de datos, no suficiente para que te contraten.','Knowing Python is necessary for data science, not sufficient to get hired.'],

 ['invert','l','Inversión','Inversion','Piensa al revés: ¿qué garantizaría el fracaso? Luego evita eso.','Think backwards: what would guarantee failure? Then avoid that.','Para mejorar en ajedrez: ¿qué me hace perder rápido? Comer peones envenenados.','To get better at chess: what makes me lose fast? Grabbing poisoned pawns.'],
 ['feedback','c','Ciclos de retroalimentación','Feedback loops','Positivos: el efecto se amplifica a sí mismo. Negativos: el sistema se corrige y se estabiliza.','Positive loops amplify themselves; negative loops correct and stabilize the system.','Un video con vistas recibe más recomendaciones y más vistas.','A video with views gets recommended more, and gets more views.'],

 ['pareto','c','Principio de Pareto (80/20)','Pareto principle (80/20)','En muchos sistemas una minoría de causas produce la mayoría de los efectos.','In many systems a minority of causes produces most of the effects.','3 de 50 tipos de error generan el 80% de los tickets.','3 of 50 error types cause 80% of the tickets.'],

 ['lightyear','f','Año luz y mirar al pasado','Light-years and looking back in time','La luz viaja a unos 300.000 km/s; un año luz es la distancia que recorre en un año. Mirar lejos es mirar al pasado.','Light travels about 300,000 km/s; a light-year is how far it goes in a year. Looking far away means looking into the past.','Ves el Sol como era hace 8 minutos y algunas estrellas como eran hace siglos.','You see the Sun as it was 8 minutes ago and some stars as they were centuries ago.'],
 ['energy','f','Conservación de la energía','Conservation of energy','La energía no se crea ni se destruye: solo cambia de forma (movimiento, calor, química, luz).','Energy is never created or destroyed: it only changes form (motion, heat, chemical, light).','Al frenar, la energía del carro se vuelve calor en los frenos.','When you brake, the car\'s energy becomes heat in the brakes.'],
 ['quantum','f','Mundo cuántico','The quantum world','A escala atómica la energía viene en paquetes, las partículas se comportan también como ondas y solo se pueden predecir probabilidades.','At the atomic scale energy comes in packets, particles also behave like waves, and only probabilities can be predicted.','Los láseres y los chips del celular funcionan gracias a la física cuántica.','Lasers and the chips in your phone work thanks to quantum physics.'],
 ['atom','f','El átomo','The atom','Un núcleo diminuto de protones y neutrones rodeado de electrones; casi todo es espacio vacío. El número de protones define el elemento.','A tiny nucleus of protons and neutrons surrounded by electrons; it is almost all empty space. The number of protons defines the element.','Si el núcleo fuera una canica, el átomo sería del tamaño de un estadio.','If the nucleus were a marble, the atom would be the size of a stadium.'],
 ['spectrum','f','Espectro electromagnético','Electromagnetic spectrum','Ondas de radio, microondas, luz visible, rayos X y gamma son lo mismo: luz con distinta longitud de onda.','Radio, microwaves, visible light, X-rays and gamma rays are the same thing: light with different wavelengths.','El wifi, el control del televisor y la luz del sol son el mismo fenómeno.','Wi-Fi, a TV remote and sunlight are the same phenomenon.'],
 ['blackhole','f','Agujero negro','Black hole','Región donde la masa está tan concentrada que nada, ni la luz, escapa una vez cruza el horizonte de eventos.','A region where mass is so concentrated that nothing, not even light, escapes once it crosses the event horizon.','En 2019 se publicó la primera imagen de la sombra de un agujero negro (galaxia M87).','In 2019 the first image of a black hole\'s shadow was published (galaxy M87).'],
 ['expansion','f','Expansión del universo','Expansion of the universe','Las galaxias lejanas se alejan más rápido cuanto más lejos están: el espacio mismo se estira desde el Big Bang, hace unos 13.800 millones de años.','Distant galaxies recede faster the farther they are: space itself has been stretching since the Big Bang, about 13.8 billion years ago.','Es como puntos en un globo que se infla: todos se alejan de todos.','Like dots on an inflating balloon: every dot moves away from every other.'],
 ['fusion','f','Fusión nuclear','Nuclear fusion','Núcleos ligeros se unen y liberan muchísima energía; así brillan las estrellas y así se formaron casi todos los elementos.','Light nuclei join and release huge amounts of energy; that is how stars shine and how most elements were made.','El hierro de tu sangre se formó dentro de estrellas que explotaron.','The iron in your blood was made inside stars that exploded.'],
 ['periodic','f','Tabla periódica','Periodic table','Ordena los elementos por número de protones; las columnas agrupan elementos que se comportan parecido por cómo tienen sus electrones.','It orders elements by number of protons; columns group elements that behave alike because of how their electrons are arranged.','El sodio y el potasio, de la misma columna, reaccionan con agua de forma parecida.','Sodium and potassium, in the same column, react with water in similar ways.'],
 ['ph','f','Ácidos, bases y pH','Acids, bases and pH','El pH mide la acidez en escala logarítmica: cada punto es 10 veces más ácido o básico. 7 es neutro.','pH measures acidity on a logarithmic scale: each step is 10 times more acidic or basic. 7 is neutral.','El jugo de limón (pH 2) es unas 100.000 veces más ácido que el agua pura.','Lemon juice (pH 2) is about 100,000 times more acidic than pure water.'],
 ['natsel','b','Selección natural','Natural selection','Los individuos varían; los rasgos que ayudan a sobrevivir y reproducirse se vuelven más comunes generación tras generación.','Individuals vary; traits that help survival and reproduction become more common generation after generation.','Las bacterias que sobreviven a un antibiótico dejan descendientes resistentes.','Bacteria that survive an antibiotic leave resistant offspring.'],

 ['cell','b','La célula','The cell','La unidad mínima de vida: una membrana, información genética y una maquinaria que fabrica proteínas y obtiene energía.','The smallest unit of life: a membrane, genetic information and machinery that builds proteins and gets energy.','Tu cuerpo tiene unos 30 billones de células, y más bacterias que eso.','Your body has about 30 trillion cells, and even more bacteria.'],
 ['immune','b','Sistema inmune y vacunas','Immune system and vaccines','El cuerpo reconoce lo extraño y guarda memoria; una vacuna entrena esa memoria sin que pases la enfermedad.','The body recognizes what is foreign and keeps a memory; a vaccine trains that memory without you getting the disease.','La viruela, que mató a cientos de millones, se erradicó con vacunación en 1980.','Smallpox, which killed hundreds of millions, was eradicated by vaccination in 1980.'],
 ['microbiome','b','Microbiota','Microbiome','Billones de microbios viven en tu intestino y piel; ayudan a digerir, entrenan al sistema inmune y producen sustancias útiles.','Trillions of microbes live in your gut and on your skin; they help digest food, train the immune system and make useful substances.','Un antibiótico fuerte puede alterar la digestión porque también mata bacterias buenas.','A strong antibiotic can upset digestion because it also kills good bacteria.'],
 ['homeo','b','Homeostasis','Homeostasis','El cuerpo mantiene estables variables clave (temperatura, azúcar, agua) con ciclos de retroalimentación negativa.','The body keeps key variables stable (temperature, sugar, water) using negative feedback loops.','Sudas cuando tienes calor y tiritas cuando tienes frío.','You sweat when hot and shiver when cold.'],

 ['circadian','b','Ritmo circadiano','Circadian rhythm','Un reloj interno de unas 24 horas regula sueño, hormonas y temperatura; la luz de la mañana lo ajusta.','An internal clock of about 24 hours runs sleep, hormones and temperature; morning light sets it.','El jet lag es ese reloj desfasado de la hora del lugar.','Jet lag is that clock out of sync with local time.'],
 ['placebo','b','Efecto placebo','Placebo effect','Creer que recibes un tratamiento puede mejorar cómo te sientes; por eso los ensayos comparan con un falso tratamiento.','Believing you are being treated can make you feel better; that is why trials compare against a fake treatment.','Una pastilla de azúcar puede aliviar algo el dolor si crees que es un analgésico.','A sugar pill can ease some pain if you think it is a painkiller.'],

 ['scale','c','Escala y proporción','Scale and proportion','Al cambiar el tamaño, no todo crece igual: el volumen crece más rápido que la superficie, y eso cambia lo posible.','When size changes, not everything grows alike: volume grows faster than surface, which changes what is possible.','Por eso no existen insectos gigantes: no podrían respirar ni sostenerse.','That is why there are no giant insects: they could not breathe or hold themselves up.'],

cosmos:{es:{t:'El Big Bang y la edad del universo',l:'Hace unos 13.800 millones de años, todo el universo observable estaba en un estado muy caliente y denso, y empezó a expandirse. Eso es el Big Bang: no una explosión en un punto, sino el estiramiento del espacio mismo.\n\nLas pruebas son fuertes: las galaxias lejanas se alejan (Hubble, 1929), existe un "eco" de luz de esa época, la radiación de fondo de microondas (descubierta en 1965), y la proporción de hidrógeno y helio coincide con lo predicho. Las primeras estrellas se encendieron unos cientos de millones de años después.',talk:'Lo curioso es que el Big Bang no pasó "en algún lugar": pasó en todas partes a la vez, porque es el espacio el que se estira.',p:null,f:[['¿Hace cuánto empezó la expansión del universo?','Unos 13.800 millones de años.'],['¿Qué es la radiación de fondo de microondas?','La luz más antigua que podemos ver, el "eco" del universo joven, descubierta en 1965.'],['¿El Big Bang fue una explosión en un punto?','No: fue la expansión del espacio en todas partes a la vez.']]},
 en:{t:'The Big Bang and the age of the universe',l:'About 13.8 billion years ago, the whole observable universe was extremely hot and dense, and it began to expand. That is the Big Bang: not an explosion at a point, but space itself stretching.\n\nThe evidence is strong: distant galaxies are moving away (Hubble, 1929), there is an "echo" of light from that era, the cosmic microwave background (discovered in 1965), and the ratio of hydrogen to helium matches the predictions. The first stars lit up a few hundred million years later.',talk:'The odd part is that the Big Bang didn\'t happen "somewhere": it happened everywhere at once, because it\'s space itself that stretches.',p:null,f:[['How long ago did the universe start expanding?','About 13.8 billion years ago.'],['What is the cosmic microwave background?','The oldest light we can see, the "echo" of the young universe, discovered in 1965.'],['Was the Big Bang an explosion at one point?','No: it was space expanding everywhere at once.']]}},
earth:{es:{t:'Tectónica de placas y los volcanes de los Andes',l:'La capa externa de la Tierra está partida en unas quince placas grandes que flotan sobre roca caliente y se mueven entre 2 y 10 cm al año, más o menos lo que crecen tus uñas.\n\nDonde chocan nacen montañas y volcanes. Frente a Colombia, la placa de Nazca se hunde bajo la suramericana: eso levanta los Andes y alimenta volcanes como el Nevado del Ruiz, cuya erupción de 1985 sepultó Armero. Donde se separan se abre el fondo del océano, como en la dorsal del Atlántico. La idea, propuesta por Wegener en 1912, solo se aceptó en los años 60.',talk:'Los Andes siguen creciendo porque una placa del Pacífico se mete debajo de Suramérica, y por eso Colombia tiembla tanto.',p:null,f:[['¿Cuánto se mueven las placas al año?','Unos pocos centímetros, de 2 a 10 cm.'],['¿Qué placa se hunde bajo Suramérica?','La placa de Nazca.'],['¿Qué tragedia causó el Nevado del Ruiz en 1985?','Sus lodos sepultaron Armero.']]},
 en:{t:'Plate tectonics and the Andes volcanoes',l:'Earth\'s outer layer is split into about fifteen large plates that ride on hot rock and move 2 to 10 cm a year, roughly as fast as your fingernails grow.\n\nWhere they collide, mountains and volcanoes form. Off Colombia, the Nazca plate dives under the South American plate: that lifts the Andes and feeds volcanoes like Nevado del Ruiz, whose 1985 eruption buried the town of Armero. Where plates pull apart, new ocean floor opens, as along the Mid-Atlantic Ridge. Wegener proposed the idea in 1912; it was only accepted in the 1960s.',talk:'The Andes are still rising because a Pacific plate is sliding under South America, which is why Colombia has so many earthquakes.',p:null,f:[['How fast do plates move?','A few centimeters a year, 2 to 10 cm.'],['Which plate sinks beneath South America?','The Nazca plate.'],['What tragedy did Nevado del Ruiz cause in 1985?','Its mudflows buried Armero.']]}},
evo:{es:{t:'Evolución por selección natural',l:'Darwin y Wallace propusieron en 1858 una idea simple y poderosa: los individuos varían, parte de esa variación se hereda, y los que sobreviven y se reproducen más dejan más copias de sus rasgos. Con el tiempo, las poblaciones cambian.\n\nNo hay "meta" ni progreso planeado; solo lo que funciona en un ambiente. Hoy la genética lo confirma: compartimos genes con todos los seres vivos, alrededor del 98% con los chimpancés. La evolución se ve en directo en bacterias que se vuelven resistentes a los antibióticos.',talk:'La evolución no busca "mejorar": solo se quedan los rasgos que funcionan en ese ambiente.',p:null,f:[['¿Quiénes propusieron la selección natural?','Charles Darwin y Alfred Russel Wallace, en 1858.'],['¿Qué tres ingredientes necesita?','Variación, herencia y diferencias en supervivencia y reproducción.'],['¿Dónde se ve la evolución en tiempo real?','En bacterias que se vuelven resistentes a antibióticos.']]},
 en:{t:'Evolution by natural selection',l:'In 1858 Darwin and Wallace proposed a simple, powerful idea: individuals vary, part of that variation is inherited, and those that survive and reproduce more leave more copies of their traits. Over time, populations change.\n\nThere is no "goal" or planned progress, only what works in a given environment. Genetics now confirms it: we share genes with all living things, about 98% with chimpanzees. You can watch evolution happen in bacteria that become resistant to antibiotics.',talk:'Evolution isn\'t trying to "improve" anything: it just keeps the traits that work in that environment.',p:null,f:[['Who proposed natural selection?','Charles Darwin and Alfred Russel Wallace, in 1858.'],['What three ingredients does it need?','Variation, inheritance and differences in survival and reproduction.'],['Where can you see evolution in real time?','In bacteria becoming resistant to antibiotics.']]}},
brain:{es:{t:'Cómo funciona la memoria',l:'La memoria no es un archivo: es una red de neuronas que se refuerza cada vez que se usa. El hipocampo ayuda a guardar recuerdos nuevos y, sobre todo durante el sueño, los "pasa" a la corteza para el largo plazo.\n\nRecordar cambia el recuerdo: cada vez que lo traes, se reconstruye y puede alterarse. Por eso los testigos se equivocan con seguridad. Lo que más ayuda a aprender: intentar recordar sin mirar, espaciar los repasos y dormir bien. Releer da sensación de saber, pero fija poco.',talk:'Cada vez que recuerdas algo lo reconstruyes, por eso podemos estar seguros de recuerdos que son falsos.',p:null,f:[['¿Qué zona del cerebro ayuda a formar recuerdos nuevos?','El hipocampo.'],['¿Cuándo se consolidan muchos recuerdos?','Durante el sueño.'],['¿Qué fija mejor: releer o intentar recordar?','Intentar recordar sin mirar (práctica de recuperación).']]},
 en:{t:'How memory works',l:'Memory isn\'t a file cabinet: it\'s a network of neurons that gets stronger each time it\'s used. The hippocampus helps store new memories and, especially during sleep, "hands them over" to the cortex for the long term.\n\nRemembering changes the memory: each time you recall it, it\'s rebuilt and can shift. That\'s why eyewitnesses can be confidently wrong. What helps learning most: trying to recall without looking, spacing out reviews, and sleeping well. Rereading feels like knowing but fixes little.',talk:'Every time you remember something you rebuild it, which is why we can be sure about memories that are false.',p:null,f:[['Which brain area helps form new memories?','The hippocampus.'],['When are many memories consolidated?','During sleep.'],['Which works better: rereading or trying to recall?','Trying to recall without looking (retrieval practice).']]}},
democ:{es:{t:'Democracia, separación de poderes y Estado de derecho',l:'La democracia moderna combina tres ideas. Elecciones libres: el pueblo elige y puede cambiar a quien gobierna. Separación de poderes (Montesquieu, siglo XVIII): ejecutivo, legislativo y judicial se vigilan entre sí para que nadie acumule todo el poder. Y Estado de derecho: las mismas leyes valen para todos, incluido el gobierno.\n\nEn Colombia, la Constitución de 1991 añadió la tutela, para proteger derechos básicos de forma rápida, y la Corte Constitucional. Una democracia no es solo votar: también necesita jueces independientes, prensa libre y respeto por las minorías.',talk:'Votar es solo una parte de la democracia; sin jueces independientes y prensa libre, las elecciones solas no bastan.',p:['Unos priorizan la voluntad de la mayoría: si el pueblo eligió, el gobierno debe poder actuar sin tantos frenos.','Otros priorizan los límites: los frenos protegen derechos y minorías aunque hagan lento el gobierno.'],f:[['¿Quién popularizó la separación de poderes?','Montesquieu, en el siglo XVIII.'],['¿Qué es el Estado de derecho?','Que las mismas leyes valen para todos, incluido el gobierno.'],['¿Qué herramienta creó la Constitución de 1991 para proteger derechos?','La acción de tutela.']]},
 en:{t:'Democracy, separation of powers and the rule of law',l:'Modern democracy combines three ideas. Free elections: the people choose and can replace those who govern. Separation of powers (Montesquieu, 18th century): the executive, legislature and courts check each other so no one holds all the power. And the rule of law: the same laws apply to everyone, including the government.\n\nIn Colombia, the 1991 Constitution added the tutela, a fast way to protect basic rights, and the Constitutional Court. Democracy isn\'t just voting: it also needs independent judges, a free press and respect for minorities.',talk:'Voting is only one part of democracy; without independent judges and a free press, elections alone aren\'t enough.',p:['Some put majority will first: if the people chose, the government should be able to act without so many brakes.','Others put limits first: checks protect rights and minorities even if they slow government down.'],f:[['Who popularized the separation of powers?','Montesquieu, in the 18th century.'],['What is the rule of law?','The same laws apply to everyone, including the government.'],['What tool did Colombia\'s 1991 Constitution create to protect rights?','The tutela.']]}},
ideol:{es:{t:'Izquierda y derecha: de dónde vienen',l:'Los términos nacen en la Asamblea francesa de 1789: los partidarios de cambios profundos se sentaban a la izquierda del presidente y los defensores del rey y del orden tradicional, a la derecha.\n\nHoy, a grandes rasgos, la izquierda enfatiza la igualdad, el papel del Estado para reducir desigualdades y los derechos colectivos; la derecha enfatiza la libertad individual, el mercado, la propiedad y la tradición. En la práctica hay muchas mezclas: liberales en lo económico y conservadores en lo social, y al revés. El eje izquierda-derecha simplifica mucho.',talk:'Lo de izquierda y derecha viene literalmente de dónde se sentaban en la Asamblea francesa de 1789.',p:['Desde la izquierda: sin un Estado activo, la desigualdad se perpetúa y la libertad real es solo para algunos.','Desde la derecha: un Estado grande frena la iniciativa, y el mercado y la responsabilidad individual crean más prosperidad.'],f:[['¿De dónde vienen los términos izquierda y derecha?','De la Asamblea francesa de 1789, por dónde se sentaban.'],['¿Qué valores enfatiza la izquierda en general?','Igualdad, papel del Estado, derechos colectivos.'],['¿Y la derecha?','Libertad individual, mercado, propiedad y tradición.']]},
 en:{t:'Left and right: where they come from',l:'The terms come from the 1789 French Assembly: supporters of deep change sat to the president\'s left, and defenders of the king and traditional order sat to the right.\n\nToday, roughly, the left emphasizes equality, the state\'s role in reducing inequality and collective rights; the right emphasizes individual liberty, markets, property and tradition. In practice there are many mixes: economically liberal and socially conservative, and the reverse. The left-right line is a big simplification.',talk:'Left and right literally come from where people sat in the 1789 French Assembly.',p:['From the left: without an active state, inequality persists and real freedom belongs to only some.','From the right: a big state holds back initiative, and markets and personal responsibility create more prosperity.'],f:[['Where do the terms left and right come from?','The 1789 French Assembly, from where people sat.'],['What does the left generally emphasize?','Equality, the state\'s role, collective rights.'],['And the right?','Individual liberty, markets, property and tradition.']]}},
colhist:{es:{t:'Colombia: de la Independencia al Frente Nacional',l:'El 20 de julio de 1810 empezó en Bogotá el proceso de independencia, que se consolidó con la batalla de Boyacá en 1819. Nació la Gran Colombia con Venezuela y Ecuador, que se separaron en 1830.\n\nEl siglo XIX fue de guerras civiles entre liberales y conservadores; la de los Mil Días (1899-1902) fue la peor, y en 1903 se separó Panamá. En 1948 el asesinato de Jorge Eliécer Gaitán desató el Bogotazo y una ola de violencia llamada La Violencia. Para frenarla, los dos partidos pactaron el Frente Nacional (1958-1974): se turnaban la presidencia.',talk:'El Frente Nacional fue un pacto en el que liberales y conservadores se turnaron el poder durante 16 años para acabar con La Violencia.',p:['Unos lo ven como un acuerdo que pacificó al país tras La Violencia.','Otros señalan que excluyó a otras fuerzas políticas y que esa exclusión alimentó el conflicto armado posterior.'],f:[['¿En qué batalla se consolidó la independencia?','La batalla de Boyacá, en 1819.'],['¿Qué hecho desató el Bogotazo en 1948?','El asesinato de Jorge Eliécer Gaitán.'],['¿Qué fue el Frente Nacional?','Un pacto (1958-1974) en el que liberales y conservadores se turnaron la presidencia.']]},
 en:{t:'Colombia: from Independence to the National Front',l:'On July 20, 1810, the independence process began in Bogotá; it was secured at the Battle of Boyacá in 1819. Gran Colombia was born together with Venezuela and Ecuador, which split off in 1830.\n\nThe 19th century saw civil wars between Liberals and Conservatives; the Thousand Days\' War (1899-1902) was the worst, and Panama separated in 1903. In 1948 the murder of Jorge Eliécer Gaitán set off the Bogotazo and a wave of violence known as La Violencia. To end it, the two parties agreed to the National Front (1958-1974): they took turns in the presidency.',talk:'The National Front was a deal in which Liberals and Conservatives took turns in power for 16 years to end La Violencia.',p:['Some see it as an agreement that brought peace after La Violencia.','Others note it shut out other political forces, and that exclusion fed the later armed conflict.'],f:[['Which battle secured independence?','The Battle of Boyacá, in 1819.'],['What set off the Bogotazo in 1948?','The murder of Jorge Eliécer Gaitán.'],['What was the National Front?','A 1958-1974 deal in which Liberals and Conservatives alternated the presidency.']]}},
wars:{es:{t:'Por qué empezó la Primera Guerra Mundial',l:'El 28 de junio de 1914, un nacionalista serbio asesinó en Sarajevo al archiduque Francisco Fernando, heredero de Austria-Hungría. Ese fue el detonante, no la causa.\n\nLas causas de fondo: alianzas que arrastraban a todos (Alemania y Austria-Hungría frente a Francia, Rusia y el Reino Unido), una carrera armamentista, rivalidades por colonias y nacionalismos. En pocas semanas una crisis regional se volvió guerra mundial. Murieron unos 20 millones de personas. El tratado de Versalles (1919) castigó duramente a Alemania, algo que muchos historiadores ligan a la Segunda Guerra.',talk:'El asesinato en Sarajevo fue la chispa, pero el bosque ya estaba seco: alianzas, armas y nacionalismo.',p:null,f:[['¿Qué evento detonó la guerra en 1914?','El asesinato del archiduque Francisco Fernando en Sarajevo.'],['Nombra dos causas de fondo.','Sistema de alianzas, carrera armamentista, rivalidad colonial, nacionalismo.'],['¿Qué tratado cerró la guerra con Alemania?','El tratado de Versalles, 1919.']]},
 en:{t:'Why World War I started',l:'On June 28, 1914, a Serbian nationalist assassinated Archduke Franz Ferdinand, heir to Austria-Hungary, in Sarajevo. That was the trigger, not the cause.\n\nThe deeper causes: alliances that dragged everyone in (Germany and Austria-Hungary against France, Russia and Britain), an arms race, colonial rivalries and nationalism. Within weeks a regional crisis became a world war. About 20 million people died. The Treaty of Versailles (1919) punished Germany harshly, which many historians link to World War II.',talk:'The Sarajevo assassination was the spark, but the forest was already dry: alliances, weapons and nationalism.',p:null,f:[['What event triggered the war in 1914?','The assassination of Archduke Franz Ferdinand in Sarajevo.'],['Name two deeper causes.','Alliance system, arms race, colonial rivalry, nationalism.'],['Which treaty ended the war with Germany?','The Treaty of Versailles, 1919.']]}},
relig:{es:{t:'Las grandes religiones del mundo',l:'Cristianismo (unos 2.300 millones): Jesús de Nazaret como hijo de Dios y salvador; católicos, protestantes y ortodoxos. Islam (unos 1.900 millones): un solo Dios, Alá, y Mahoma como su profeta; el Corán. Hinduismo (unos 1.200 millones): muchas formas de lo divino, el karma y la reencarnación. Budismo: el sufrimiento nace del apego y puede superarse con el camino que enseñó Buda. Judaísmo: el pacto de un Dios único con el pueblo de Israel; es la raíz del cristianismo y del islam.\n\nCasi una de cada seis personas no tiene religión.',talk:'El judaísmo, el cristianismo y el islam se llaman religiones abrahámicas porque las tres se remontan a Abraham.',p:['Para los creyentes, la religión da sentido, comunidad y una guía moral que va más allá de lo material.','Para los no creyentes, la moral y el sentido pueden construirse desde la razón y la experiencia humana, sin lo sobrenatural.'],f:[['¿Cuál es la religión con más fieles?','El cristianismo, con unos 2.300 millones.'],['¿Qué tres religiones se llaman abrahámicas?','Judaísmo, cristianismo e islam.'],['¿Qué enseña el budismo sobre el sufrimiento?','Que nace del apego y puede superarse siguiendo el camino del Buda.']]},
 en:{t:'The world\'s major religions',l:'Christianity (about 2.3 billion): Jesus of Nazareth as the son of God and savior; Catholics, Protestants and Orthodox. Islam (about 1.9 billion): one God, Allah, and Muhammad as his prophet; the Quran. Hinduism (about 1.2 billion): many forms of the divine, karma and reincarnation. Buddhism: suffering comes from attachment and can be overcome through the path the Buddha taught. Judaism: the covenant of one God with the people of Israel; it is the root of Christianity and Islam.\n\nNearly one in six people has no religion.',talk:'Judaism, Christianity and Islam are called Abrahamic religions because all three trace back to Abraham.',p:['For believers, religion gives meaning, community and moral guidance beyond the material.','For non-believers, morality and meaning can be built from reason and human experience, without the supernatural.'],f:[['Which religion has the most followers?','Christianity, about 2.3 billion.'],['Which three religions are called Abrahamic?','Judaism, Christianity and Islam.'],['What does Buddhism teach about suffering?','It comes from attachment and can be overcome by following the Buddha\'s path.']]}},
philo:{es:{t:'Estoicismo',l:'Escuela de la antigua Grecia y Roma (Zenón, Séneca, Epicteto, el emperador Marco Aurelio). Su idea central: distingue lo que depende de ti (tus juicios, tus actos) de lo que no (el clima, lo que hagan otros, la suerte), y pon tu energía solo en lo primero.\n\nPara los estoicos, lo que nos perturba no son los hechos sino lo que pensamos de ellos. Volvió de moda porque es práctico, y la terapia cognitivo-conductual moderna se inspiró en parte en esa idea. No se trata de no sentir, sino de no dejar que las emociones decidan por ti.',talk:'Los estoicos decían que no te molesta lo que pasa, sino lo que piensas sobre lo que pasa; esa idea inspiró la terapia cognitiva.',p:null,f:[['Nombra dos estoicos famosos.','Séneca, Epicteto, Marco Aurelio, Zenón.'],['¿Cuál es la distinción central del estoicismo?','Lo que depende de ti y lo que no.'],['¿Qué terapia moderna se inspiró en parte en el estoicismo?','La terapia cognitivo-conductual.']]},
 en:{t:'Stoicism',l:'A school from ancient Greece and Rome (Zeno, Seneca, Epictetus, the emperor Marcus Aurelius). Its core idea: separate what depends on you (your judgments, your actions) from what doesn\'t (the weather, what others do, luck), and put your energy only into the first.\n\nFor the Stoics, what disturbs us isn\'t events but what we think about them. It became popular again because it\'s practical, and modern cognitive behavioral therapy drew partly on that idea. It isn\'t about not feeling, but about not letting emotions decide for you.',talk:'The Stoics said it\'s not what happens that upsets you but what you think about it, an idea that inspired cognitive therapy.',p:null,f:[['Name two famous Stoics.','Seneca, Epictetus, Marcus Aurelius, Zeno.'],['What is Stoicism\'s core distinction?','What depends on you and what doesn\'t.'],['Which modern therapy drew partly on Stoicism?','Cognitive behavioral therapy.']]}},
sex:{es:{t:'Sexualidad humana según la ciencia',l:'El deseo sexual depende del cerebro tanto como del cuerpo: hormonas como la testosterona y los estrógenos influyen en él, y la dopamina participa en la motivación y el placer. El estrés, el sueño y la relación de pareja también lo cambian mucho.\n\nLa ciencia distingue el sexo biológico, la identidad de género y la orientación sexual. La orientación aparece temprano, no se elige ni se "cura", y la homosexualidad dejó de considerarse un trastorno en 1973 (Asociación Americana de Psiquiatría) y en 1990 para la OMS. La diversidad sexual existe en muchas especies.',talk:'La OMS dejó de considerar la homosexualidad un trastorno en 1990; la orientación sexual no se elige.',p:['Para muchas tradiciones religiosas, la sexualidad tiene un propósito moral ligado al matrimonio y la familia.','Para la visión secular y científica predominante, la diversidad sexual es una variación natural y la ética se basa en el consentimiento.'],f:[['¿Qué tres cosas distingue la ciencia?','Sexo biológico, identidad de género y orientación sexual.'],['¿Cuándo dejó la OMS de considerar la homosexualidad un trastorno?','En 1990.'],['¿Qué neurotransmisor se asocia a la motivación y el placer?','La dopamina.']]},
 en:{t:'Human sexuality according to science',l:'Sexual desire depends on the brain as much as the body: hormones like testosterone and estrogen influence it, and dopamine plays a role in motivation and pleasure. Stress, sleep and the relationship itself also change it a lot.\n\nScience distinguishes biological sex, gender identity and sexual orientation. Orientation appears early, isn\'t chosen or "cured", and homosexuality stopped being classed as a disorder in 1973 (American Psychiatric Association) and in 1990 for the WHO. Sexual diversity exists in many species.',talk:'The WHO stopped classifying homosexuality as a disorder in 1990; sexual orientation isn\'t chosen.',p:['For many religious traditions, sexuality has a moral purpose tied to marriage and family.','In the prevailing secular and scientific view, sexual diversity is a natural variation and ethics rests on consent.'],f:[['What three things does science distinguish?','Biological sex, gender identity and sexual orientation.'],['When did the WHO stop classing homosexuality as a disorder?','In 1990.'],['Which neurotransmitter is linked to motivation and pleasure?','Dopamine.']]}},
health:{es:{t:'El sueño: qué pasa mientras duermes',l:'Dormir no es apagarse. Cada noche pasas por ciclos de unos 90 minutos: sueño ligero, sueño profundo (el cuerpo se repara y se consolidan recuerdos) y sueño REM (soñamos, y se procesan emociones y aprendizajes).\n\nDurante el sueño el cerebro limpia desechos y se regulan hormonas del hambre y del estrés. Un adulto necesita entre 7 y 9 horas. Dormir 6 o menos de forma habitual se asocia con peor memoria, más accidentes, más riesgo cardíaco y peor ánimo. La luz de pantallas de noche retrasa el reloj interno.',talk:'Dormir es cuando el cerebro guarda lo que aprendiste ese día; por eso trasnochar estudiando funciona tan mal.',p:null,f:[['¿Cuánto dura un ciclo de sueño?','Unos 90 minutos.'],['¿En qué fase soñamos más?','En el sueño REM.'],['¿Cuántas horas necesita un adulto?','Entre 7 y 9.']]},
 en:{t:'Sleep: what happens while you sleep',l:'Sleep isn\'t switching off. Each night you go through cycles of about 90 minutes: light sleep, deep sleep (the body repairs and memories consolidate) and REM sleep (we dream, and emotions and learning get processed).\n\nDuring sleep the brain clears waste and regulates hunger and stress hormones. Adults need 7 to 9 hours. Regularly sleeping 6 or less is linked to worse memory, more accidents, higher heart risk and lower mood. Screen light at night pushes your internal clock later.',talk:'Sleep is when your brain stores what you learned that day, which is why all-nighters work so badly.',p:null,f:[['How long is a sleep cycle?','About 90 minutes.'],['In which stage do we dream most?','REM sleep.'],['How many hours does an adult need?','7 to 9.']]}},
money:{es:{t:'Inflación y qué hace un banco central',l:'La inflación es la subida general de precios: con la misma plata compras menos. Puede venir de demasiado dinero persiguiendo pocos bienes, de costos que suben (como el petróleo) o de expectativas: si todos esperan precios más altos, suben salarios y precios.\n\nEl banco central (en Colombia, el Banco de la República, independiente desde 1991) intenta mantenerla baja, con una meta del 3%. Su herramienta principal es la tasa de interés: si la sube, los créditos se encarecen, la gente gasta menos y los precios se calman, aunque también frena la economía.',talk:'Cuando el Banco de la República sube las tasas, busca enfriar el gasto para que bajen los precios, aunque eso frene la economía.',p:['Unos creen que el banco central debe priorizar la inflación baja aunque cueste crecimiento.','Otros piden más peso al empleo y al crecimiento, aceptando algo más de inflación.'],f:[['¿Qué es la inflación?','La subida general de precios: el dinero compra menos.'],['¿Cuál es la meta de inflación del Banco de la República?','3%.'],['¿Cuál es su herramienta principal?','La tasa de interés.']]},
 en:{t:'Inflation and what a central bank does',l:'Inflation is a general rise in prices: the same money buys less. It can come from too much money chasing too few goods, from rising costs (like oil) or from expectations: if everyone expects higher prices, wages and prices go up.\n\nThe central bank (in Colombia, the Banco de la República, independent since 1991) tries to keep it low, targeting 3%. Its main tool is the interest rate: raising it makes credit more expensive, people spend less and prices calm down, though it also slows the economy.',talk:'When the central bank raises rates, it\'s trying to cool spending so prices come down, even if it slows the economy.',p:['Some believe the central bank should put low inflation first, even at the cost of growth.','Others want more weight on jobs and growth, accepting somewhat higher inflation.'],f:[['What is inflation?','A general rise in prices: money buys less.'],['What is Colombia\'s central bank inflation target?','3%.'],['What is its main tool?','The interest rate.']]}}
};
